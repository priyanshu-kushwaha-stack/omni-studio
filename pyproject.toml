[project]
name = "omni-studio"
version = "0.1.0"
description = "Private multi-channel video studio built on OpenMontage"
requires-python = ">=3.12,<3.13"
# Mirrors core/openmontage/requirements.txt.
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "jsonschema>=4.20",
    "python-dotenv>=1.0",
    "Pillow>=10.0",
    "numpy>=1.24",
    "requests>=2.31",
    "google-auth>=2.0",
    "google-genai>=1.0.0",
    "openai>=2.44.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "watchfiles>=0.21",
    "websockets>=14.0",
]

[dependency-groups]
# Mirrors core/openmontage/requirements-dev.txt.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.24",
]
# The Professor of Us engine (core/engines/pou), pinned as faceless-channel's requirements-dev.txt.
# Media models (torch, mlx, chatterbox, mflux) live in .venv-media: requirements-media.txt.
engine = [
    "scipy==1.18.1",
    "scikit-image==0.26.0",
]

[tool.uv]
default-groups = ["dev", "engine"]

[project.scripts]
omni = "studio.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["core"]
include = ["studio*"]
exclude = ["studio.tests*"]
