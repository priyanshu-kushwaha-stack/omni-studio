# Every outside tool omni-studio runs is pinned here.
# tools/video/hyperframes_compose.py reads hyperframes.version at import.
upstream:
  repo: https://github.com/calesthio/OpenMontage.git
  commit: d21f5d4eaa08422b09c7091757a05affcbabb35b
  prefix: core/openmontage
hyperframes:
  npm: hyperframes
  version: 0.9.16
remotion:
  npm: remotion
  version: 4.0.484
  installed_by: npm ci in core/openmontage/remotion-composer (package-lock.json)
git_filter_repo:
  # Imported core/engines/pou with history (Phase 3). Installed in a throwaway venv, not in .venv.
  pip: git-filter-repo
  version: 2.47.0
  imported_from: ~/Exploration/projects/faceless-channel a2c04b002735c4d1699ad3032318b7a879259f21 (scripts/, tests/)
media_venv:
  # .venv-media for the Professor of Us engine: NumPy 1.26.4, torch 2.6.0, mlx 0.32.4, mflux 0.24.0,
  # chatterbox-tts 0.1.7, mlx-audio 0.6.2, transformers 5.2.0, faster-whisper 1.2.1, Python 3.12.
  # The exact set is requirements-media.lock.txt, installed with uv pip install --no-deps.
  top_level: requirements-media.txt
  exact: requirements-media.lock.txt
skills:
  # Git tree hashes of the skills vendored with the upstream commit above.
  vendored:
    core/openmontage/skills: 2fcc98358735ab2cb2f36a1ade592d9c8735752f
    core/openmontage/.agents/skills: e60fcef3be57b8b928ce5c7b0d924510c49c56ff
    core/openmontage/.claude/skills: 5c3347ccaee44878ad91d1cb26dd7d1fb9ebe29b
  # Add an entry only after reviewing the skill's contents.
  third_party_installed: []
youtubeuploader:
  # core/studio/publish/youtube.py runs only this binary, after re-hashing it. Install with
  # `.venv/bin/omni upload --install`: it fetches the release tarball, checks tarball_sha256, extracts the binary
  # into install_dir (git-ignored) and checks binary_sha256. Read at this tag: files.go LoadVideoMeta sets
  # status.selfDeclaredMadeForKids from metaJSON "madeForKids" and status.containsSyntheticMedia from
  # "containsSyntheticMedia", and force-sends both (false is sent, not omitted). Neither has a CLI flag.
  repo: https://github.com/porjo/youtubeuploader
  version: 1.25.5
  tag: v1.25.5
  commit: 301e5635160b3373f1548537a1bca1a3aaa9aa72
  install_dir: .tools/youtubeuploader/1.25.5
  platforms:
    Darwin_arm64:
      asset: youtubeuploader_1.25.5_Darwin_arm64.tar.gz
      tarball_sha256: 89b29cbdb5db46a1607e6a4767c1718aa12bf7a22e566e10d174f329f4a48a73
      binary_sha256: 6473b246b6dad7baa5cbfcae0c10555ffaeac466049b9e613c4ca1907af751be
whatif_engine:
  # core/engines/whatif, imported 2026-11-06 from the owner's sample (~/Exploration/sandbox/what-if-pause, no commits).
  # Exact versions are in its pnpm-lock.yaml; install with `pnpm install --frozen-lockfile` in that folder.
  package_manager: pnpm 9.15.9
  remotion: 4.0.484          # remotion, @remotion/cli, google-fonts, motion-blur, noise, paths
  react: 18.3.1
  dev: [typescript 5.9.3, vitest 2.1.9, tsx 4.23.15]
  calls: higgsfield CLI 1.1.23 (narration quotes and takes; paid, owner-approved only)
yt_dlp:
  # Used once, 2026-11-06, for the Say Suppose reference study; YouTube blocked it and the owner supplied the files.
  # Installed with uv into the git-ignored .tools/yt-dlp venv, outside the studio's two venvs.
  pip: yt-dlp
  version: 2026.10.21
  install_dir: .tools/yt-dlp

ruff:
  # Lint and format for core/studio and core/engines (config in pyproject.toml [tool.ruff]); never core/openmontage.
  # Installed by uv into .venv (dev group, uv.lock). The Makefile falls back to `uvx ruff@<version>` when the shared
  # .venv lacks it. Keep pyproject.toml, uv.lock, the Makefile's RUFF and this entry on one version.
  pip: ruff
  version: 0.17.2
local_voices:
  # Free local voices for the what-if engine (core/engines/whatif/pipeline/local_tts.py, which loads these exact
  # revisions), run in .venv-media through mlx-audio 0.6.2. Hugging Face cache, never in git.
  qwen3:
    # The narrator: Arthur, cloned from brand/voice/arthur-ref.wav (owner picked it by ear, 2026-11-10).
    repo: mlx-community/Qwen3-TTS-12Hz-1.7B-Base-bf16
    revision: a6eb4f68e4b056f1215157bb696209bc82a6db48
    publisher: Qwen (Alibaba); MLX conversion by mlx-community
    license: apache-2.0
  qwen3-design:
    # Characters: a voice made from a written description, with the line's direction as its emotion; nobody is
    # cloned. Owner approved the download on 2026-11-12 (4.52 GB).
    repo: mlx-community/Qwen3-TTS-12Hz-1.7B-VoiceDesign-bf16
    revision: 7d3824abff87e49756bb0f83fb5411de75d160c4
    publisher: Qwen (Alibaba); MLX conversion by mlx-community
    license: apache-2.0
    size_gb: 4.52
