# Professor of Us playbook: styles/stickman-explainer.yaml from the sandbox (63c1736), which faceless-channel used.
identity:
  name: "Professor of Us"
  category: whiteboard
  mood: curious, warm, hand-made, exact
  # Spec says "brisk"; schema enum is slow|deliberate|moderate|fast|rapid, so "fast" is the closest.
  pace: fast
  best_for: "Long-form illustrated curiosity explainers: ancient humans, brain and body, history of everyday things"

visual_language:
  color_palette:
    primary: ["#2B2B2B", "#4A4A4A"]
    accent: ["#D9A441", "#B5533C", "#3A7D7B"]
    background: "#F6F1E7"
    text: "#2B2B2B"
    muted: "#8A8378"
  composition: centered subject, generous negative space, paper margin, one focal object per frame, right third kept quiet in the final 15 s for end screens
  texture: cream paper grain, marker line, no gradients, no photographic realism

typography:
  headings:
    font: "Patrick Hand"
    weight: 400
    tracking: "0em"
  body:
    font: "Patrick Hand"
    weight: 400
    line_height: 1.4
  code:
    font: "Fira Code"
    weight: 400
  stat_card:
    font: "Patrick Hand"
    weight: 400
    size_multiplier: 3.5
  scale_system: "major_third"
  weight_matrix:
    title: 400
    heading: 400
    body: 400
    caption: 400

motion:
  transitions: [cut, wipe-left, fade]
  animation_style: "draw-on reveal first (HyperFrames: GSAP DrawSVG; Remotion: @remotion/paths evolvePath); gentle push-in on stills; cards (StatCard, ComparisonCard, CalloutBox, TextCard, LineChart, BarChart) in the handwriting font; diagram_gen for maps and process diagrams; labels as handwriting overlays never baked into images; no bounce"
  pacing_rules:
    min_scene_hold_seconds: 2
    max_scene_hold_seconds: 6
    text_card_hold_seconds: 3
    stat_card_hold_seconds: 3
    transition_duration_seconds: 0.25
  entrance: "draw-on from left (mask wipe) 0.4 s"
  exit: "fade 0.2 s"

audio:
  voice_style: "calm, curious, exact; second person; 150-165 wpm; directed pauses (~1 s before reversals); no hype"
  music_mood: "3-5 cues per video that change at section turns: soft acoustic for the question, sparse piano for evidence, low pulse for the reversal, warm resolve for the answer; 60-90 BPM; no vocals"
  music_volume: 0.08
  sfx_style: "pencil scratch on draw-ons, soft page-turn at section changes, one quiet sting on 'but' turns; never on every change; ~1 s of silence (music and voice) before reveals"
  ducking_threshold_db: -6

asset_generation:
  image_prompt_prefix: "Hand-drawn stick-figure explainer illustration, black marker on cream paper, thin confident lines, minimal shading, one accent colour (ochre), lots of empty paper, slightly imperfect hand-made look, no text"
  image_negative_prompt: "photo, 3d render, text, letters, watermark, gradient, neon"
  diagram_style: "hand-drawn marker lines on cream paper, wobbly boxes and arrows, handwriting-font labels, single ochre accent, no fills or gradients"
  consistency_anchors:
    - "Cream paper (#F6F1E7) background in every frame"
    - "Thin black marker line (#2B2B2B); ochre (#D9A441) as the single in-image accent"
    - "Reference images: channel/style_refs/ref-*.png for every generated image, plus model-sheet-you.png for any scene with the recurring character (these live in the faceless-channel repo; the playbook just names them)"
    - "Stick figures with simple round heads and no facial detail; no text inside generated images"

overlays:
  stat_card:
    bg: "#F6F1E7"
    border: "#2B2B2B"
    radius: 4
    shadow: "none"
  key_term:
    bg: "#F1E7CF"
    text: "#2B2B2B"
    radius: 4
  code_block:
    bg: "#EFE8DA"
    text: "#2B2B2B"
    highlight: "#B5533C"
  section_title:
    bg: "#F6F1E7"
    text: "#2B2B2B"
    accent: "#D9A441"
    radius: 0
  stat_reveal:
    bg: "#F6F1E7"
    text: "#2B2B2B"
    accent: "#D9A441"
    radius: 4
  hero_title:
    bg: "#F6F1E7"
    text: "#2B2B2B"
    accent: "#B5533C"
    radius: 0
  provider_chip:
    bg: "#EFE8DA"
    text: "#4A4A4A"
    border: "#8A8378"
    radius: 4

quality_rules:
  - "A classified visual change every 3-6 seconds; at least 8 changes in every minute; holds of 6-12 s only for an evolving map or chart; 2-4 s in the first 60 s"
  - "Every change adds information or motion: motion on a drawing, a card, a new illustration, a recurring-character moment, or a hero clip"
  - "Labels and numbers are handwriting-font overlays; no text inside generated images"
  - "No frame is a photoreal AI image; no video is 100% static stills; at least 30% of scenes carry motion"
  - "Subtitles are not burned in; captions ship as an SRT sidecar"
  - "The final 10-15 s keep the right third of the frame quiet for end screens"
  - "Minimum contrast ratio 4.5:1 for all text on the cream background"
  - "At most one accent colour per frame; ochre by default, rust or teal only for contrast in comparisons"

chart_palette:
  - "#2B2B2B"
  - "#D9A441"
  - "#B5533C"
  - "#3A7D7B"
  - "#8A8378"

color_rules:
  harmony_type: "split-complementary"
  contrast_validation: true
  colorblind_safe: true
