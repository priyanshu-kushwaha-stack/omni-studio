# Say Suppose playbook: the owner's pause-time sample (~/Exploration/sandbox/what-if-pause, src/theme.ts),
# approved as the channel's look on 2026-11-06. Validated by schemas/styles/playbook.schema.json.
identity:
  name: "Say Suppose"
  category: custom
  mood: curious, dry, warm, exact
  pace: fast
  best_for: "Second-person what-if stories, any length the story earns, where every real-world claim is sourced"

visual_language:
  color_palette:
    primary: ["#F2B632", "#1D9A8F"]
    accent: ["#D8344F"]
    # Text lives on cards, not on the sets: paper lettering on ink (the counter) and ink on paper (tags).
    # The playbook records the counter's pairing.
    background: "#23252B"
    text: "#F3E9D7"
    muted: "#B7A98F"
  composition: the viewer's figure in nearly every frame, flat sets in parallax layers, one focal action per shot, right third kept quiet in the final 15 s for end screens
  texture: flat paper-cut shapes with a soft cut shadow, paper grain and a vignette over the frame, no gradients on figures, no photographic realism

typography:
  headings:
    font: "Rubik"
    weight: 800
  body:
    font: "Rubik"
    weight: 800
  stat_card:
    font: "Rubik"
    weight: 800

motion:
  transitions: [cut]
  animation_style: "code-rigged figures (walk, run, tiptoe, reach, blink) and props timed to named cue words; camera moves with parallax; spring-stamped tags; split-flap counter; no lip-sync, no line boil, no AI motion"
  pacing_rules:
    min_scene_hold_seconds: 2
    max_scene_hold_seconds: 6
    transition_duration_seconds: 0.2

audio:
  voice_style: "one narrator in second person, present tense; dry, warm, exact; about 115 words a minute with 15-20% wordless beats; directed per line; no hype"
  music_mood: "a score per video with a theme for 'you'; cues change at the beats; rises in wordless beats, ducks under the voice; no vocals"
  music_volume: 0.08
  sfx_style: "synthesised effects on actions and on the rule device; never on every change"

asset_generation:
  image_prompt_prefix: ""
  image_negative_prompt: ""
  consistency_anchors:
    - "No generated images: every frame is drawn in code as flat paper-cut shapes"
    - "The viewer's figure: mustard head (#F2B632) with a tuft, teal scarf (#1D9A8F), ink body (#23252B)"
    - "Crimson (#D8344F) only for the stranger and for alarms"
    - "On-screen text only as a paper tag, a split-flap counter, a speech bubble or a source tag, in Rubik 800"
    - "Every scene has a mood light (grade, rim light, depth of field, glows, vignette); flat daylight is the exception"

quality_rules:
  - "Something changes every 2 to 4 seconds; no hold longer than 6 seconds"
  - "Motion is timed to cue words, never to hard-coded times"
  - "15 to 20% of the runtime is wordless; the biggest beat gets 8 to 10 wordless seconds"
  - "A face reaction within 2 seconds of every reveal"
  - "No frame is an AI image and no clip is AI video"
  - "Every spoken real-world number, date, name or finding has a claims.md row; story numbers are in words"
  - "On-screen text stays off faces, inside the safe area, and never overlaps other text"
  - "The final 15 s keep the right third of the frame quiet for end screens"
  - "Minimum contrast ratio 4.5:1 for all text"

chart_palette:
  - "#F2B632"
  - "#1D9A8F"
  - "#D8344F"
  - "#23252B"
  - "#B7A98F"
