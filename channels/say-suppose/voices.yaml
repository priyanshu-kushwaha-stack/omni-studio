# Character name -> tool, voice id and settings. Keys and tokens do not belong here.
# Every Higgsfield call is paid: announce tool, provider, model and cost, and get the owner's approval first.
voices:
  narrator:
    label: NARR
    tool: higgsfield elevenlabs_v4   # Eleven v4: takes delivery direction in the text. Quoted 0.23 credits a test line
    voice_type: preset
    voice_id: 30fc8796-ceb6-4a66-b3a7-4a145ef7f346   # Arthur. The owner kept the sample's voice (2026-11-06)
    settings: {}
    fallback: {tool: higgsfield text2speech_v2, variant: elevenlabs}   # the sample's route, no direction
    takes: one per script line, cached by a hash of voice, direction and text
    stitch: "silence capped at 0.3 s; no speed-up (about 115 words a minute)"
    # The channel's narrator: voice B, locked by the owner on 2026-11-15 ("lets lock it as the narrators voice and i
    # will tell you if we have to make changes to it in future"). Free and local: a voice designed from text with Qwen3
    # VoiceDesign (seed 4101, nobody cloned), whose own cool read every line is cloned from with Qwen3 Base, so it stays
    # one voice. The recipe to remake the wavs is in
    # videos/2026-11-13_what-if-ai-rented-your-brain-while-you-slept/narrator.py. The wavs are git-ignored (*.wav):
    # copy narrator-b-cool.wav and narrator-b-warm.wav into brand/voice/ by hand on a new machine. narrator-b-warm.wav is
    # the same voice's warm read, for a film's closing lesson (that film's narrator.py points those lines at it).
    # Voice A (the earlier local narrator, cloned from Arthur's paid takes) stays in brand/voice/arthur-ref.wav.
    # WHATIF_VOICE=paid takes the paid narrator above; paid takes need a quote and the owner's yes.
    use: local
    local:
      engine: qwen3
      ref: brand/voice/narrator-b-cool.wav
      ref_text: "Twice a week, you sell your plasma, the pale part of your blood. It's the most the law allows. That's the band. A thin strip you wear across your forehead. While you sleep, it lends your brain to a company. And it pays you, by the hour."
  # Characters: a script line "Name: text" is spoken by that character in their own free local voice, never the
  # narrator's (owner, 2026-11-12: "the voice is flat and it's plain narration"; picked free local voices). Qwen3-TTS
  # VoiceDesign (core/lock.yaml) makes each voice from the description below, so nobody is cloned, and takes the
  # line's [direction] from say.yaml as its emotion. Takes are seeded by the voice, but the model draws each take
  # afresh, so a character's voice can drift a little between lines: the owner heard A/B on the doubled-money opening
  # and kept per-line emotion over one voice cloned from a designed clip (2026-11-12, "A: emotion per line").
  # A name not in the cast takes the stock voice of the first role word in its name ("Bank man" -> man), else
  # anyone's, and the build says so. Open with the voice itself: gender and a voice type, alto, mezzo, baritone or
  # bass ("A low, warm female voice:", "A relaxed male baritone:"). Without one the model drifts between takes; a seed
  # sweep (2026-11-12) put "middle register", "tenor" and "young man" anywhere from 104 to 218 Hz and "baritone" at
  # 111-129 Hz. Then age, texture and manner, and keep every voice apart from Arthur's.
  characters:
    engine: qwen3-design
    cast:
      # What If You Doubled Your Money Every Day (2026-11-12): Berlin, Lotte's bakery.
      Lotte: >-
        A low, warm female voice: a woman in her late fifties, a baker who has seen everything. Alto, slightly husky,
        unhurried and dry, a hint of a German accent. Speaks plainly, close to the listener.
      Jonas: >-
        A relaxed male baritone: a man of about thirty, the listener's flatmate. Young, warm and a little husky, quick
        and playful, easy laughter under the words, casual modern English.
      Bank man: >-
        A thin, precise male baritone: a bank officer in his fifties. Slightly nasal, polite and measured, every word
        chosen, a quiet clerk's restraint.
      Flour man: >-
        A deep, gravelly male bass: a delivery man in his forties who hauls flour sacks. Big, gruff, loud and blunt, a
        working man's voice from the back of a van.
      Woman: >-
        A sharp, bright female voice: a woman in her sixties on a city tram. Slightly nasal mezzo, quick and
        indignant, a voice that carries down the whole carriage.
      Driver: >-
        A flat, tired male baritone: a tram driver in his forties. Gravelly, bored and matter-of-fact, speaking over
        his shoulder like a public announcement.
      # Fired everyone and hired AI (2026-11-15): a diner across the road from a car plant, a small American car town.
      Marco: >-
        A young, warm male tenor: a short-order cook in his late twenties. Slightly hoarse, easygoing and quick to laugh,
        cheeky, a little breathless, a working man's casual American English.
      Waitress: >-
        A quick, bright female mezzo: a diner waitress in her thirties. Dry, wry and fast, a pencil-behind-the-ear
        voice that has heard every excuse, flat American vowels, a smile under the sarcasm.
      Plant boss: >-
        A big, booming male baritone: a car-plant boss in his fifties. Confident and loud, a salesman's warmth, quick to
        laugh at his own jokes, a voice used to talking over machinery.
      Banker: >-
        A smooth, precise male tenor: a small-town bank manager in his sixties. Polite, slightly pompous, every
        consonant crisp, a man pleased to correct you.
      Mayor: >-
        A clear, ringing female alto: a small-town mayor in her fifties. Warm and public, a speech-giver's lift on every
        line, upbeat and a little too sure of herself.
      Rival: >-
        A low, gravelly female voice: a diner owner in her sixties across town. Husky, blunt and sardonic, slow and
        knowing, a smoker's rasp, never impressed.
      Plumber: >-
        A deep, slow male bass: a plumber in his forties. Unhurried, stubborn and amused, few words and every one
        final, a man who knows nobody else can fix the sink.
      Reporter: >-
        A bright, fast female soprano: a local TV reporter in her twenties. Eager and clipped, a broadcaster's
        projection, every question pitched up like a headline.
    stock:
      woman: A clear, warm female voice, a woman in her forties. Mezzo, natural and conversational.
      man: A plain, steady male baritone, a man in his forties. Natural and conversational.
      girl: A high, bright girl's voice, about ten years old. Quick, natural and lively.
      boy: A high, bright boy's voice, about ten years old. Quick, natural and lively.
      kid: A high, bright child's voice, about ten years old. Quick, natural and lively.
      anyone: A clear, neutral mid-range adult voice, in their thirties. Natural and conversational.
