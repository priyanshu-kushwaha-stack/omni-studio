<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@800;900&display=swap">
<style>body{margin:0}.t{position:relative;width:1280px;height:720px;overflow:hidden;font-family:Rubik,sans-serif}
.t img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cap{position:absolute;font-weight:900;line-height:.92;color:#fff;-webkit-text-stroke:0;paint-order:stroke;text-shadow:0 0 0 #000,
 6px 6px 0 #000,-6px 6px 0 #000,6px -6px 0 #000,-6px -6px 0 #000,0 8px 0 #000,0 -8px 0 #000,8px 0 0 #000,-8px 0 0 #000,0 14px 26px rgba(0,0,0,.6)}
.g{color:#7df9c6}
.label{position:absolute;padding:10px 26px;border-radius:40px;background:rgba(8,20,24,.78);border:4px solid #7df9c6;color:#7df9c6;font-weight:900;font-size:64px;box-shadow:0 0 28px 6px rgba(125,249,198,.65),inset 0 0 18px rgba(125,249,198,.35)}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 55%,transparent 55%,rgba(0,0,0,.45))}
</style></head><body>
<div class="t" id="t"></div>
<script>
const v=location.hash.slice(1);
const T={
 g1:`<img src="g1.png"><div class="vig"></div><div class="label" style="left:540px;top:200px;font-size:54px">99/100</div>
     <div class="cap" style="left:760px;top:26px;font-size:120px;text-align:right;width:480px">WHY<br><span class="g">HER?</span></div>`,
 g3:`<img src="g3.png"><div class="vig"></div>
     <div class="cap" style="left:800px;top:330px;font-size:96px;text-align:right;width:450px">SHE<br>FORGOT<br><span class="g">ME.</span></div>`,
 g4:`<img src="g4.png"><div class="vig"></div>
     <div class="cap" style="left:28px;top:400px;font-size:120px">I'M<br><span class="g">#100?!</span></div>`
};
document.getElementById('t').innerHTML=T[v];
</script></body></html>
