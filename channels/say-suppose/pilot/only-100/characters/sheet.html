<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@800&family=Inter:wght@500;600&display=swap">
<style>
body{margin:0;background:#1d1f2b;font-family:Inter,system-ui,sans-serif;color:#eee;width:1600px}
.row{display:flex;gap:14px;align-items:stretch;padding:14px 20px}
.label{width:190px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.label b{font:800 26px Rubik,sans-serif}
.label span{font-size:14px;color:#aab}
.card{width:220px;height:300px;background:linear-gradient(180deg,#f3efe7,#e4ddd0);border-radius:10px;display:flex;flex-direction:column;align-items:center}
.card svg{width:200px;height:270px}
.card i{font-style:normal;font-size:13px;color:#555;margin-top:-6px}
.thumb{width:320px;height:180px;border-radius:10px;overflow:hidden;align-self:center}
</style></head><body>
<div id="out"></div>
<script src="characters.js"></script>
<script src="scene.js"></script>
<script>
let html="";
for(const key of Object.keys(DESIGNS)){
  const d=DESIGNS[key];
  html+=`<div class="row"><div class="label"><b>${d.name}</b><span>${d.note}</span></div>`;
  for(const ex of EXPRESSIONS) html+=`<div class="card"><svg viewBox="0 0 200 300">${character(key,ex)}</svg><i>${ex}</i></div>`;
  html+=`<div class="thumb">${scene(key)}</div></div>`;
}
document.getElementById("out").innerHTML=html;
// export each thumbnail standalone for the feed test
window.SCENES=Object.keys(DESIGNS).map(scene);
</script></body></html>
