# What each script line speaks: the direction in square brackets (also the per-line delivery for the free
# narration: emotion, level and pace), numbers spelled out, and the spoken forms from the script's narration
# notes (v3, 2026-11-10): Mehta -> "Mayta", Diwali -> "Diwaali", dal -> "daal". A character's line drops its
# "Mom:" / "Grandpa:" / "Mehta:" prefix: the name is not spoken. Keys must match a spoken line of script.md.

"Every morning she waves, and every morning you wave back without looking.": "[warm, close] Every morning she waves, and every morning you wave back without looking."
"Forty-two.": "[almost a whisper] Forty-two."
"So what if you knew the last time you'd see someone?": "[curious, low] So what if you knew the last time you'd see someone?"
"Mom: Call the minute you reach!": "[warm, calling out from the door] Call the minute you reach!"
"Tonight you leave for a first job, in a city that doesn't know your name yet.": "[dry, easy] Tonight you leave for a first job, in a city that doesn't know your name yet."
"That's forty-two goodbyes left at that door. What would you do with them?": "[warm, slower] That's forty-two goodbyes left at that door. What would you do with them?"
"Nobody else can see it. Just you.": "[light, confiding] Nobody else can see it. Just you."
"Everyone you know has one: the times you'll actually be in the same room again, if your plans stay exactly as they are.": "[plain, exact] Everyone you know has one: the times you'll actually be in the same room again, if your plans stay exactly as they are."
"Calls don't count. Only being there.": "[plain, exact] Calls don't count. Only being there."
"Change your plans, and it does the maths again.": "[plain, exact] Change your plans, and it does the maths again."
"Keep the life you've just signed up for, two trips home a year, and that comes to forty-two.": "[dry] Keep the life you've just signed up for, two trips home a year, and that comes to forty-two."
"It's a number. It only counts down.": "[wry, offhand] It's a number. It only counts down."
"And she'll be at that door. She always is.": "[easy, certain] And she'll be at that door. She always is."
"Next morning, in the new city, the chai-wallah on platform two reads one.": "[amused] Next morning, in the new city, the chai-wallah on platform two reads one."
"One last chai, from a man you'll never see again.": "[softer] One last chai, from a man you'll never see again."
"And somehow it's the best chai of your life. Station chai.": "[surprised] And somehow it's the best chai of your life. Station chai."
"Maybe it isn't the chai.": "[curious, low] Maybe it isn't the chai."
"In one taste test, students were told, \"This is your last chocolate.\"": "[quick, an aside] In one taste test, students were told, \"This is your last chocolate.\""
"64% picked it as their favourite, whatever the flavour.": "[quick, an aside] Sixty-four per cent picked it as their favourite, whatever the flavour."
"You almost go back for a second glass, but then it wouldn't be the last.": "[amused] You almost go back for a second glass, but then it wouldn't be the last."
"On the metro, a total stranger reads four hundred: four hundred mornings with someone you'll never speak to.": "[puzzled, then dry] On the metro, a total stranger reads four hundred: four hundred mornings with someone you'll never speak to."
"She's your commute now.": "[deadpan] She's your commute now."
"And at the office there's Mehta from Accounts, who reads three thousand.": "[dry] And at the office there's Mayta from Accounts, who reads three thousand."
"So you hide.": "[conspiratorial, quick] So you hide."
"Mehta: Saved you a seat!": "[cheerful, too loud] Saved you a seat!"
"Three thousand meetings, and most of them are actual meetings.": "[deadpan] Three thousand meetings, and most of them are actual meetings."
"Then comes your first Friday. Go home, or sleep till noon?": "[teasing] Then comes your first Friday. Go home, or sleep till noon?"
"Home. Obviously.": "[dry] Home. Obviously."
"You thought it would drop when you left. It drops when you walk in.": "[surprised, quieter] You thought it would drop when you left. It drops when you walk in."
"This visit was already counted.": "[low] This visit was already counted."
"She's had the chai ready since your train left the city.": "[warm, fond] She's had the chai ready since your train left the city."
"And Grandpa reads eight.": "[warm] And Grandpa reads eight."
"Grandpa: So there I was, on my bicycle, and the buffalo...": "[old man, delighted, telling a tale] So there I was, on my bicycle, and the buffalo..."
"You've never once stayed for the end of this story.": "[fond, wry] You've never once stayed for the end of this story."
"Grandpa: How does it end?": "[puzzled, gentle] How does it end?"
"You don't know it either.": "[dry] You don't know it either."
"Mom: Next month?": "[hopeful, soft] Next month?"
"You say, \"Let's see. Work.\"": "[warm, casual] You say, \"Let's see. Work.\""
"Thirty-nine. You didn't lose one visit, you lost two.": "[flat, quiet] Thirty-nine. You didn't lose one visit, you lost two."
"Because \"let's see\" was a plan too, and it did the maths.": "[dry, landing] Because \"let's see\" was a plan too, and it did the maths."
"Thirty-nine. Fine. Call it an allowance, and you'll spend it carefully.": "[wry, half to yourself] Thirty-nine. Fine. Call it an allowance, and you'll spend it carefully."
"It only counts down. You've watched it.": "[certain, a little too sure] It only counts down. You've watched it."
"Then October comes, with Diwali and a deadline in the same week.": "[brisk] Then October comes, with Diwaali and a deadline in the same week."
"Thirty-nine is plenty. Skip this one, and save it for later.": "[breezy] Thirty-nine is plenty. Skip this one, and save it for later."
"Mom: Look, I lit all of them!": "[proud, excited, on a phone] Look, I lit all of them!"
"Calls don't count.": "[flat] Calls don't count."
"Thirty-eight. You skipped it to save it, and it's just gone.": "[low, slow] Thirty-eight. You skipped it to save it, and it's just gone."
"Mehta, meanwhile, is doing fine.": "[deadpan] Mayta, meanwhile, is doing fine."
"Thirty-eight visits, a weekend each.": "[careful, slow] Thirty-eight visits, a weekend each."
"A writer, Tim Urban, once did this sum on his own guesses.": "[plain] A writer, Tim Urban, once did this sum on his own guesses."
"By the time he left school? 93%.": "[plain] By the time he left school? Ninety-three per cent."
"Of his time with his parents, in person, already used up.": "[plain] Of his time with his parents, in person, already used up."
"Your strip is thinner.": "[quiet, exact] Your strip is thinner."
"You're not at the start of your time with her. You're at the tail end.": "[hushed] You're not at the start of your time with her. You're at the tail end."
"Then a Friday comes with no festival and no plan. Train, or sleep?": "[tired] Then a Friday comes with no festival and no plan. Train, or sleep?"
"Train.": "[quick, decided] Train."
"Thirty-eight. Here comes the drop.": "[tense, quiet] Thirty-eight. Here comes the drop."
"Mom: Next month, then?": "[teasing, hopeful] Next month, then?"
"You open your mouth to say \"let's see\".": "[quick, half-swallowed] You open your mouth to say \"let's see\"."
"It wasn't her clock. It was your timetable.": "[hushed, slow, warm] It wasn't her clock. It was your timetable."
"It only counted down because you only ever planned less.": "[warm, landing] It only counted down because you only ever planned less."
"But then the offer comes: a bigger job, in a bigger city, on duty every festival.": "[brisk, tempting] But then the offer comes: a bigger job, in a bigger city, on duty every festival."
"Nine.": "[cold, quiet] Nine."
"The offer, or the Friday train?": "[low, warm] The offer, or the Friday train?"
"Saying no isn't a plan. A ticket is.": "[dry, landing] Saying no isn't a plan. A ticket is."
"Mom: More dal?": "[warm, laughing] More daal?"
"Grandpa's story? You learned the ending. Well. You made one up.": "[amused, warm] Grandpa's story? You learned the ending. Well. You made one up."
"Grandpa: Hah! Yours is better.": "[old man, laughing, delighted] Hah! Yours is better."
"Of course she is.": "[hushed, warm] Of course she is."
"Whose number would you want to see? Tell us below.": "[warm, plain] Whose number would you want to see? Tell us below."
