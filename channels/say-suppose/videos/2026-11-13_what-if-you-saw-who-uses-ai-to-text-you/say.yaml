"Mother: Make a wish. A real one.": "[warm, teasing, shielding a candle] Make a wish. A real one."
"Mother: What? What is it?": "[alarmed, leaning in, half a laugh] What? What is it?"
"You asked who meant it. The candle gave you something better.": "[sly, delighted, a secret shared] You asked who meant it. The candle gave you something better."
"So what if you could see who uses AI to text you? Everyone who did. Every time.": "[quick, conspiratorial, the last four words savoured] So what if you could see who uses AI to text you? Everyone who did. Every time."
"Catch anyone you like. Just never get caught catching.": "[sly, quick, a dare, a grin on the last word] Catch anyone you like. Just never get caught catching."
"Forty-one birthday wishes. Thirty-three dots. One on your best friend's paragraph. Even her.": "[brisk, amazed, a gasp of a laugh on the last two words] Forty-one birthday wishes. Thirty-three dots. One on your best friend's paragraph. Even her."
"And the only wish you'd have marked down for spelling is the only one a person typed. Your father. Eight months out on a cargo ship. Three words, one wrong. Same as always.": "[dry, amused, fond on the last three words] And the only wish you'd have marked down for spelling is the only one a person typed. Your father. Eight months out on a cargo ship. Three words, one wrong. Same as always."
"You've always graded people by their messages. Long means love. Short means busy. A typo means they couldn't be bothered.": "[teasing, quick, a confession on your behalf] You've always graded people by their messages. Long means love. Short means busy. A typo means they couldn't be bothered."
"The rule. Every message you can read, in any app, from anyone, a text, a comment, a review: if a machine chose the words, it gets a small red dot. Whoever's thumbs pressed send.": "[clear, brisk, exact, each item a beat, the last sentence pointed] The rule. Every message you can read, in any app, from anyone, a text, a comment, a review: if a machine chose the words, it gets a small red dot. Whoever's thumbs pressed send."
"Only you see them. They are never wrong.": "[plain, certain, a little thrilled] Only you see them. They are never wrong."
"But a dot says who wrote it. It never says why. Remember that.": "[measured, slower, the last two words almost a whisper] But a dot says who wrote it. It never says why. Remember that."
"Mother: Dots? What dots?": "[puzzled, holding the phone to the window, mild] Dots? What dots?"
"Your father is one of about two million Filipinos working overseas. For a family like yours, the phone is where home is.": "[steady, warm, the fact said plainly] Your father is one of about two million Filipinos working overseas. For a family like yours, the phone is where home is."
"Four words in, and your own phone offers to be you. In grey.": "[quick, amused, then cool on the last two words] Four words in, and your own phone offers to be you. In grey."
"You don't send it. First: who else?": "[sly, a plan forming, a hook on the last two words] You don't send it. First: who else?"
"You go through your phone like customs.": "[brisk, amused, officious] You go through your phone like customs."
"Your boss. So proud of this team, a whole paragraph. Dot. Your sick day, noted. No dot. He only types the bad news.": "[dry, a wince of a joke on the last sentence] Your boss. So proud of this team, a whole paragraph. Dot. Your sick day, noted. No dot. He only types the bad news."
"Your two aunts. Eleven messages this week, all between them.": "[amused, setting up a trick] Your two aunts. Eleven messages this week, all between them."
"Aunt one: Lovely.": "[pleased, reading her one word aloud as she types it] Lovely."
"Aunt two: She writes so beautifully.": "[proud, moved, to nobody] She writes so beautifully."
"Aunt one: Forgive me? For what?": "[baffled, indignant, to the phone] Forgive me? For what?"
"Nobody did anything. Two machines fought and made up all week, and both aunts are proud of them.": "[deadpan, a laugh held under it] Nobody did anything. Two machines fought and made up all week, and both aunts are proud of them."
"Now, the obvious move. Why not just ask?": "[conspiratorial, the comment section's voice] Now, the obvious move. Why not just ask?"
"Aunt one: Every word, my love.": "[sweet, sincere, beaming] Every word, my love."
"Dot. On the answer. You can't just ask. People lie. Dots don't.": "[a beat of silence first, then quick and gleeful, the last four words clipped] Dot. On the answer. You can't just ask. People lie. Dots don't."
"Your mother's eat first, every letter fixed by the phone. Bare. Chosen words get a dot. Fixed letters don't.": "[fond, then exact, a rule being learned] Your mother's eat first, every letter fixed by the phone. Bare. Chosen words get a dot. Fixed letters don't."
"Nobody suspects a thing. In a study of more than 1,300 Americans, people read a personal message. Told it was written by AI, they called the sender lazy and insincere. Told nothing, most never suspected.": "[hushed, a secret, the fact quick and clear, a grin on the last sentence] Nobody suspects a thing. In a study of more than thirteen hundred Americans, people read a personal message. Told it was written by AI, they called the sender lazy and insincere. Told nothing, most never suspected."
"But here's problem one. You've checked everyone except the one you're afraid to.": "[leaning in, low, the last word soft] But here's problem one. You've checked everyone except the one you're afraid to."
"Your best friend. Bea. Eleven years. Her paragraph had a dot on it.": "[quieter, careful, a detective naming a suspect] Your best friend. Bea. Eleven years. Her paragraph had a dot on it."
"You don't ask. You know what asking gets you. You test. The one thing no machine could know.": "[quick, cunning, pleased with yourself] You don't ask. You know what asking gets you. You test. The one thing no machine could know."
"Perfect. In nine seconds. Dot.": "[stunned, then flat on the last word] Perfect. In nine seconds. Dot."
"So the machine knows about the goat. Which means somewhere, there's a file on you.": "[slow, thrilled and a little spooked, the last five words a whisper] So the machine knows about the goat. Which means somewhere, there's a file on you."
"You delete your long reply. Two letters.": "[clipped, cold, decisive] You delete your long reply. Two letters."
"Two seconds. Dot. Then you make the mistake every detective makes. You check your own pockets.": "[dry, quick, a hook on the last sentence] Two seconds. Dot. Then you make the mistake every detective makes. You check your own pockets."
"Your sent folder. A year back.": "[hushed, a held breath, a dare] Your sent folder. A year back."
"Your thank-you to your boss. Dot. Half this morning's thank-yous. Dots. You've been grading people for a crime you commit before breakfast.": "[each dot a small blow, then a laugh at yourself on the last sentence] Your thank-you to your boss. Dot. Half this morning's thank-yous. Dots. You've been grading people for a crime you commit before breakfast."
"For years, Gmail has offered to suggest your replies and finish your sentences as you type.": "[calm, exact, a fact that lands on you] For years, Gmail has offered to suggest your replies and finish your sentences as you type."
"The detective is a suspect.": "[deadpan, a complete thought] The detective is a suspect."
"You typed that a year ago, after a fight with her, and forgot. The machine didn't.": "[quick, a little amazed, the last three words slow] You typed that a year ago, after a fight with her, and forgot. The machine didn't."
"You switch every suggestion off. Not guilt. Strategy. You can't see everyone's dots and be covered in them.": "[brisk, hard, a plan] You switch every suggestion off. Not guilt. Strategy. You can't see everyone's dots and be covered in them."
"Problem two. Now you think dots predict people. So you bet dinner on them.": "[leaning in, sly, a turn on the last sentence] Problem two. Now you think dots predict people. So you bet dinner on them."
"Saturday. Your mother's party for you. Twenty wouldn't-miss-its. You count the dots. Nineteen.": "[quick, amused, counting] Saturday. Your mother's party for you. Twenty wouldn't-miss-its. You count the dots. Nineteen."
"Mother: Twenty said yes.": "[firm, proud, a spoon in hand] Twenty said yes."
"One came. Not your cousin, the bare yes: she only calls in from abroad. Your best friend, dotted all week, in your kitchen anyway.": "[deadpan, then a small puzzled note on the last five words] One came. Not your cousin, the bare yes: she only calls in from abroad. Your best friend, dotted all week, in your kitchen anyway."
"Your mother sends your father a photo of nineteen clean plates. His reply, in seconds.": "[dry, setting up] Your mother sends your father a photo of nineteen clean plates. His reply, in seconds."
"No dot. You don't call. You're busy predicting the future. As long as the future is a dinner party.": "[quick, self-mocking, a grin] No dot. You don't call. You're busy predicting the future. As long as the future is a dinner party."
"Monday. The office. The client complains. Your coworker takes it.": "[brisk, a scene set in four strokes] Monday. The office. The client complains. Your coworker takes it."
"Coworker: Ten minutes. I'll write something.": "[breezy, confident, already typing] Ten minutes. I'll write something."
"He writes something. Dot.": "[deadpan, a beat before the last word] He writes something. Dot."
"Coworker: Prove it.": "[cocky, arms folded] Prove it."
"You can't. A screenshot comes out clean. Nobody else sees a dot.": "[flat, a little stung, exact] You can't. A screenshot comes out clean. Nobody else sees a dot."
"Coworker: Fine. I'll type it myself.": "[huffy, defiant] Fine. I'll type it myself."
"Coworker: I typed every letter!": "[outraged, betrayed by his own thumbs] I typed every letter!"
"Dot. The dot follows who chose the words, not whose thumbs moved.": "[gleeful, exact, the rule recited like a verdict] Dot. The dot follows who chose the words, not whose thumbs moved."
"So you prove it the one way you can. Out loud. Right, three times in a row.": "[quick, building, a showman] So you prove it the one way you can. Out loud. Right, three times in a row."
"By lunch, the whole floor types with its thumbs. Like an exam.": "[dry, delighted, hushed on the last three words] By lunch, the whole floor types with its thumbs. Like an exam."
"Manager: How do you know?": "[quiet, curious, a pen already moving] How do you know?"
"You shrug. He writes that down. By hand. Trouble is, everybody wants to plug in the lie detector.": "[amused, then a shade of warning on the last sentence] You shrug. He writes that down. By hand. Trouble is, everybody wants to plug in the lie detector."
"But your best friend's dot still doesn't fit. Two seconds, every time, at four in the morning. You go and catch her at it.": "[low, nosy, a detective on a stakeout] But your best friend's dot still doesn't fit. Two seconds, every time, at four in the morning. You go and catch her at it."
"Two a.m. The night bus.": "[hushed, quick, a city going by] Two a.m. The night bus."
"Bus kid: How do you spell sorry?": "[small, serious, tongue out, six years old] How do you spell sorry?"
"Six years old. Not a dot on him.": "[dry, approving, a little envious] Six years old. Not a dot on him."
"Shift lead: Twelve hours. Don't wake her.": "[whispered, firm, kind] Twelve hours. Don't wake her."
"That's who answers you at four in the morning. Her, a year ago, making sure she'd never miss you.": "[quiet, the one soft line, a small smile in it] That's who answers you at four in the morning. Her, a year ago, making sure she'd never miss you."
"A dot never says why. That's a why.": "[low, plain, the plant paying off] A dot never says why. That's a why."
"Best friend: You came?": "[half asleep, hoarse, glad] You came?"
"Best friend: Eleven years, and you sent me ok.": "[a laugh breaking in it, not angry, awake now] Eleven years, and you sent me ok."
"Her machine is still texting you while she's talking to you. You'd have bet the house on that dot.": "[quick, delighted, a laugh under the second sentence] Her machine is still texting you while she's talking to you. You'd have bet the house on that dot."
"Then you look up, and the city is red.": "[wide, a breath of awe, a grin] Then you look up, and the city is red."
"The restaurant downstairs. Five stars, dotted, every one. One bare review: two stars, fish was ok, waiter was rude. You eat there.": "[brisk, amused, the review read flat, a decision on the last three words] The restaurant downstairs. Five stars, dotted, every one. One bare review: two stars, fish was ok, waiter was rude. You eat there."
"One bare review. First useful thing you've read all day.": "[deadpan, pleased, a verdict] One bare review. First useful thing you've read all day."
"Cousin: Thank you all so much. I love you all.": "[bright, tearful, waving at a camera] Thank you all so much. I love you all."
"Four hundred comments under your cousin's video. A field of red. She's crying at bots.": "[wry, then a laugh on the last sentence] Four hundred comments under your cousin's video. A field of red. She's crying at bots."
"The dating-app man. A month of flirting, never typed a word. He asks you to dinner. Dotted.": "[dry, quick, the last word flat] The dating-app man. A month of flirting, never typed a word. He asks you to dinner. Dotted."
"His first real message. Bare. Awful. You say yes.": "[deadpan, a grin on the last three words] His first real message. Bare. Awful. You say yes."
"You can make one man type. You can't make a city do it. And now the people in charge find out.": "[quick, wry, then a chill on the last sentence] You can make one man type. You can't make a city do it. And now the people in charge find out."
"Newsreader: The senator's apology has now been shared over a million times.": "[measured, professional, a newsroom cadence] The senator's apology has now been shared over a million times."
"Dot. A machine apologised, a million machines accepted, and your mother cried.": "[deadpan, quick, a laugh on the last four words] Dot. A machine apologised, a million machines accepted, and your mother cried."
"Mother: He sounds so sincere.": "[moved, a hand to her chest] He sounds so sincere."
"You could call the station. And say what?": "[dry, a shrug in the voice] You could call the station. And say what?"
"Then your boss. The senator's rival wants a list of which supporters are real. A bonus bigger than a year's pay. It arrives with a dot. He didn't even write it.": "[low, tempted, then flat and amused on the last two sentences] Then your boss. The senator's rival wants a list of which supporters are real. A bonus bigger than a year's pay. It arrives with a dot. He didn't even write it."
"That bonus could bring your father home for good.": "[low, tempted, quiet] That bonus could bring your father home for good."
"You'd sell. Everyone would. But a dot never says why. Half of those dotted supporters are tired people who let a phone finish a sentence. If a machine wrote it but they meant it, does it still count? The first one who proves she's real, you're the fraud, and every liar in town has your name. Keep it, and it stays yours.": "[quick, both sides weighed, the question put straight to you, dread on the fraud, hard and certain on the last sentence] You'd sell. Everyone would. But a dot never says why. Half of those dotted supporters are tired people who let a phone finish a sentence. If a machine wrote it but they meant it, does it still count? The first one who proves she's real, you're the fraud, and every liar in town has your name. Keep it, and it stays yours."
"So you do the cleverest thing all week. You hand him everything.": "[sly, relishing it, a pause before the last sentence] So you do the cleverest thing all week. You hand him everything."
"Manager: There's nothing there.": "[flat, puzzled, handing it back] There's nothing there."
"Nobody can buy what nobody can see. The flaw in the power is the lock on it.": "[triumphant, quiet, a complete thought] Nobody can buy what nobody can see. The flaw in the power is the lock on it."
"On the roof, you see what keeping them buys. Try not to enjoy it.": "[wide, then a grin on the last sentence] On the roof, you see what keeping them buys. Try not to enjoy it."
"Around the turn of the century, the Philippines was called the texting capital of the world. Every lit window is a chat. From up here, you see the dots.": "[awe, slow, hushed on the last sentence] Around the turn of the century, the Philippines was called the texting capital of the world. Every lit window is a chat. From up here, you see the dots."
"Now take away the dotted ones.": "[very quiet, a dare, a smile in it] Now take away the dotted ones."
"Half the city is talking, and nobody's home. And you're the only person alive who knows which half.": "[awe, slow, then a thrill on the last sentence] Half the city is talking, and nobody's home. And you're the only person alive who knows which half."
"Your phone buzzes on the roof. A calendar reminder you never set.": "[puzzled, quick, a hook] Your phone buzzes on the roof. A calendar reminder you never set."
"You delete it. At nine, you go anyway.": "[dry, then a decision, amused at yourself] You delete it. At nine, you go anyway."
"Best friend: You booked this?": "[surprised, wary, hopeful] You booked this?"
"Best friend: ...Neither did I.": "[slow, a dawning, almost a laugh] Neither did I."
"Two phones. The night you made up, three months ago. Every line. Both sides. Dotted.": "[quick, then each of the last five words alone, amazed] Two phones. The night you made up, three months ago. Every line. Both sides. Dotted."
"Her instruction. Yours. Two machines, told the same thing by two people who were asleep, made up on your behalf and booked you a cafe.": "[wonder, a laugh starting under it, building to the last five words] Her instruction. Yours. Two machines, told the same thing by two people who were asleep, made up on your behalf and booked you a cafe."
"In a 2023 study, people who suspected their chat partner was using AI-suggested replies judged them more harshly. Using them made the conversation warmer and closer.": "[calm, exact, the second sentence plain and a little pleased] In a twenty twenty-three study, people who suspected their chat partner was using AI-suggested replies judged them more harshly. Using them made the conversation warmer and closer."
"Neither of you wrote it. Both of you still came. Phones face down. Nothing to dot. Now you have to talk. Harder than it looks.": "[warm, quick, a laugh on the last sentence] Neither of you wrote it. Both of you still came. Phones face down. Nothing to dot. Now you have to talk. Harder than it looks."
"That evening. Your boss. No dot.": "[quiet, a chill, each fragment alone] That evening. Your boss. No dot."
"The first thing he's ever typed to you himself. You taught him what bare looks like. Not why he sent it.": "[low, dread with a dry laugh in it, the last sentence pointed] The first thing he's ever typed to you himself. You taught him what bare looks like. Not why he sent it."
"Your father, still at the bottom. Three words, one wrong. Send. No dot. Obviously.": "[brisk, fond, a shrug on the last word] Your father, still at the bottom. Three words, one wrong. Send. No dot. Obviously."
"Mother: He never could spell.": "[fond, not turning round, a smile in it] He never could spell."
"Then your cousin drops a voice note. The first voice in a chat that's only ever been text.": "[quick, curious, a hook held back] Then your cousin drops a voice note. The first voice in a chat that's only ever been text."
"So, how many of your last ten texts would get a dot? Tell us in the comments. And if you'd have done the same, hit like and subscribe.": "[direct, sly, a grin] So, how many of your last ten texts would get a dot? Tell us in the comments. And if you'd have done the same, hit like and subscribe."
