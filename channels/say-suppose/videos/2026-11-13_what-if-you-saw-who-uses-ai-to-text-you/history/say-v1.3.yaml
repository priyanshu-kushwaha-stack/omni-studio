"Mother: Make a wish. A real one.": "[warm, teasing, shielding a candle] Make a wish. A real one."
"Mother: What? What is it?": "[alarmed, leaning in, half a laugh] What? What is it?"
"You asked who meant it. The candle answered the easier question.": "[hushed, dry, a little stunned] You asked who meant it. The candle answered the easier question."
"So what if you could see who uses AI to text you? Everyone who did. Every time.": "[curious, leaning in on the question, the last four words slow] So what if you could see who uses AI to text you? Everyone who did. Every time."
"Forty-one messages. Thirty-three dots. One on your best friend's paragraph. And the only one you'd have marked down for spelling is the only one a person typed.": "[dry, soft, the last clause landing] Forty-one messages. Thirty-three dots. One on your best friend's paragraph. And the only one you'd have marked down for spelling is the only one a person typed."
"Your father. Eight months out on a cargo ship. Three words, one of them wrong, same as always.": "[tender, a small smile on the last three words] Your father. Eight months out on a cargo ship. Three words, one of them wrong, same as always."
"You've always graded people by their messages. Long means love. Short means busy. A typo means they couldn't be bothered.": "[warm, teasing, a confession on your behalf] You've always graded people by their messages. Long means love. Short means busy. A typo means they couldn't be bothered."
"The rule. Every message you can read, in any app, from anyone, a text, a comment, a review: if a machine wrote it and a person only pressed send, or didn't even do that, it gets a small red dot.": "[clear, brisk, exact, each item a beat] The rule. Every message you can read, in any app, from anyone, a text, a comment, a review: if a machine wrote it and a person only pressed send, or didn't even do that, it gets a small red dot."
"Only you see them. They are never wrong.": "[plain, certain] Only you see them. They are never wrong."
"But a dot says who wrote it. It never says why. Remember that.": "[measured, slower, the last two words almost a whisper] But a dot says who wrote it. It never says why. Remember that."
"Mother: Dots? What dots?": "[puzzled, turning the phone over, mild] Dots? What dots?"
"Your father is one of about two million Filipinos working overseas. For a family like yours, the phone is where home is.": "[tender, steady, the fact said gently] Your father is one of about two million Filipinos working overseas. For a family like yours, the phone is where home is."
"You start writing him something long. Something worthy. After four words, the phone offers the rest. In grey.": "[warm, then slowing, the last two words cold] You start writing him something long. Something worthy. After four words, the phone offers the rest. In grey."
"You don't send it. Not yet. First you want to know who else. And whether eleven years of her paragraphs were ever hers.": "[quiet, a decision forming, a hook on the last three words] You don't send it. Not yet. First you want to know who else. And whether eleven years of her paragraphs were ever hers."
"The landlord. Rent reminder, cold, two lines. No dot.": "[brisk, amused, surprised on no dot] The landlord. Rent reminder, cold, two lines. No dot."
"Your boss. So proud of this team, a whole paragraph. Dot. Your sick day, noted. No dot. He typed the one you didn't want.": "[dry, a wince of a joke on the last sentence] Your boss. So proud of this team, a whole paragraph. Dot. Your sick day, noted. No dot. He typed the one you didn't want."
"Your two aunts. Eleven messages this week, all between them.": "[amused, setting up] Your two aunts. Eleven messages this week, all between them."
"Aunt one: Lovely.": "[pleased, reading her one word aloud as she types it] Lovely."
"Aunt two: She writes so beautifully.": "[proud, moved, to nobody] She writes so beautifully."
"Aunt one: Forgive me? For what?": "[baffled, indignant, to the phone] Forgive me? For what?"
"Nobody did anything. Two machines have fought and made up all week, and both aunts are proud of them.": "[deadpan, a laugh held under it] Nobody did anything. Two machines have fought and made up all week, and both aunts are proud of them."
"Your cousin abroad. Thinking of you always. Dot. Ouch.": "[wry, a small wince on the last word] Your cousin abroad. Thinking of you always. Dot. Ouch."
"The man from the dating app. A month of flirting, every line dotted. He has never typed you a word.": "[dry, then flat and a little hurt on the last sentence] The man from the dating app. A month of flirting, every line dotted. He has never typed you a word."
"Then the pattern. The warm ones are dotted. The bare ones are short, late and misspelt.": "[slower, hurt, the floor tilting] Then the pattern. The warm ones are dotted. The bare ones are short, late and misspelt."
"Your mother's eat first, every letter fixed by the phone: bare. Chosen words get a dot. Fixed letters don't.": "[fond, then exact] Your mother's eat first, every letter fixed by the phone: bare. Chosen words get a dot. Fixed letters don't."
"In a study this year, more than 1,300 Americans read a personal message. Told it was written by AI, they called the sender lazy and insincere. Told nothing, most never suspected.": "[clear, calm, the fact plain, a chill on the last sentence] In a study this year, more than thirteen hundred Americans read a personal message. Told it was written by AI, they called the sender lazy and insincere. Told nothing, most never suspected."
"And you agree with them. A machine can't mean it.": "[plain, certain, a wrong certainty] And you agree with them. A machine can't mean it."
"But here's problem one. You've checked everyone but the one you're afraid to.": "[leaning in, hushed, the last word soft] But here's problem one. You've checked everyone but the one you're afraid to."
"Your best friend. Bea. Eleven years. The paragraph that made you cry this morning had a dot on it.": "[tender, slow, the last clause almost unwilling] Your best friend. Bea. Eleven years. The paragraph that made you cry this morning had a dot on it."
"You don't ask. Asking is accusing. You test: the one thing only she would know.": "[quiet, careful, a plan] You don't ask. Asking is accusing. You test: the one thing only she would know."
"The day a goat got on your school bus and sat down next to her.": "[warm, a laugh under it] The day a goat got on your school bus and sat down next to her."
"The first time in eleven years you've sent her two letters.": "[cold, clipped, quiet] The first time in eleven years you've sent her two letters."
"Then you make the mistake every detective makes. You check your own pockets.": "[low, dry, a hook on the last sentence] Then you make the mistake every detective makes. You check your own pockets."
"Your sent folder. A year back.": "[hushed, a held breath] Your sent folder. A year back."
"Your thank-you to your boss. Dot. Your condolence to a coworker whose father died. Dot. Half of this morning's thank-yous. Dots.": "[flat, each dot a small blow, shame rising] Your thank-you to your boss. Dot. Your condolence to a coworker whose father died. Dot. Half of this morning's thank-yous. Dots."
"For years, Google has offered to suggest your email replies and finish your sentences as you type.": "[calm, exact, a fact that lands on you] For years, Google has offered to suggest your email replies and finish your sentences as you type."
"The detective is a suspect.": "[quiet, ashamed, a complete thought] The detective is a suspect."
"You typed that a year ago, after a fight with her. You forgot. The machine never did.": "[slow, hushed, the last sentence landing] You typed that a year ago, after a fight with her. You forgot. The machine never did."
"You switch every suggestion off.": "[clipped, hard] You switch every suggestion off."
"But here's problem two. You can't un-know what you are. So you become the opposite.": "[leaning in, low, a turn on the last sentence] But here's problem two. You can't un-know what you are. So you become the opposite."
"You type every word yourself now. Short. Late. Clumsy. Not a dot on you.": "[dry, brisk, a montage voice, a little proud] You type every word yourself now. Short. Late. Clumsy. Not a dot on you."
"Hers get longer. Are we okay. Did I do something. I'm here, whenever. Dot. Dot. Dot.": "[mounting, each message a shade sadder, the dots flat] Hers get longer. Are we okay. Did I do something. I'm here, whenever. Dot. Dot. Dot."
"The dots become a blade. You leave the aunts' chat. You block the man from the dating app.": "[hard, quick, ruthless] The dots become a blade. You leave the aunts' chat. You block the man from the dating app."
"You never see it.": "[quiet, bare, a little sad] You never see it."
"Mother: Why so cold with everyone?": "[mild, worried, not turning round] Why so cold with everyone?"
"Your father. No dot. You don't call.": "[soft, guilty, slowing] Your father. No dot. You don't call."
"The one person who never gets a dot is the one you keep not answering.": "[low, the hook quiet] The one person who never gets a dot is the one you keep not answering."
"Mother: He never could spell. Look.": "[fond, a laugh in it, showing you] He never could spell. Look."
"Mother: The card's not his. That is.": "[quiet, certain, touching the pen] The card's not his. That is."
"For over a hundred years, people have signed their names under somebody else's words.": "[calm, thinking, the fact said gently] For over a hundred years, people have signed their names under somebody else's words."
"And she kept every one, for three words in pen.": "[warm, slow on the last four words] And she kept every one, for three words in pen."
"A dot is a greeting card that hides the card.": "[thinking aloud, a complete thought] A dot is a greeting card that hides the card."
"But a card has a signature. A dot means they didn't even sign.": "[colder, certain, the wrong belief said plainly] But a card has a signature. A dot means they didn't even sign."
"So you decide to end it. Eleven years. To her face.": "[quiet, hard, a decision] So you decide to end it. Eleven years. To her face."
"The night bus. Two in the morning. Her call centre is across the city.": "[hushed, tired, a city going by] The night bus. Two in the morning. Her call centre is across the city."
"Bus kid: How do you spell sorry?": "[small, serious, tongue out, six years old] How do you spell sorry?"
"What limits a friendship is time. Every friendship costs time to keep.": "[calm, careful, the fact said close] What limits a friendship is time. Every friendship costs time to keep."
"Twelve hours a night. For eleven years you graded her hours, and never asked where they came from.": "[quiet, the floor tilting, a little ashamed] Twelve hours a night. For eleven years you graded her hours, and never asked where they came from."
"Coworker: Twelve hours. Don't wake her.": "[whispered, firm, kind] Twelve hours. Don't wake her."
"Best friend: You came?": "[half asleep, hoarse, disbelieving, glad] You came?"
"She was keeping you with the only hours she had left: the ones she was asleep for.": "[tender, slow, a complete thought] She was keeping you with the only hours she had left: the ones she was asleep for."
"You said a dot means they didn't even sign. She signed a year ago.": "[quiet, the break landing, no triumph] You said a dot means they didn't even sign. She signed a year ago."
"Her side. Your week. Ok. Fine. K. Not a dot on them. All honest. All read as you leaving.": "[flat, each word a small blow, hurt on the last sentence] Her side. Your week. Ok. Fine. K. Not a dot on them. All honest. All read as you leaving."
"Then her drafts. Twenty she never sent. Four in the morning. Her own thumbs. Misspelt. Bare.": "[hushed, slow, every fragment heavier] Then her drafts. Twenty she never sent. Four in the morning. Her own thumbs. Misspelt. Bare."
"Best friend: I didn't know how to say it right.": "[small, tired, ashamed] I didn't know how to say it right."
"You'd have believed every one. She never sent them. Not good enough. You taught her that. Long means love.": "[hurt, quiet, the last three words bitter] You'd have believed every one. She never sent them. Not good enough. You taught her that. Long means love."
"Best friend: Eleven years, and you sent me ok.": "[hurt, a laugh breaking in it, not angry] Eleven years, and you sent me ok."
"But when you look up, it was never just your phone.": "[low, widening, a hook] But when you look up, it was never just your phone."
"The restaurant downstairs. Five-star reviews. A dot on every one.": "[wide, wry] The restaurant downstairs. Five-star reviews. A dot on every one."
"Cousin: Thank you all so much. I love you all.": "[bright, tearful, waving at a camera] Thank you all so much. I love you all."
"Four hundred comments under your cousin's video. A field of red.": "[flat, turning grim] Four hundred comments under your cousin's video. A field of red."
"At work, you start calling it. That review: machine-written. Those comments too. Right every time.": "[brisk, sharp, a little gleeful, a shade of warning on the last three words] At work, you start calling it. That review: machine-written. Those comments too. Right every time."
"One security company estimated that in 2024, bots, good and bad, passed people: 51 per cent of all web traffic, for the first time in a decade.": "[clear, exact, a touch of awe] One security company estimated that in twenty twenty-four, bots, good and bad, passed people: fifty-one per cent of all web traffic, for the first time in a decade."
"Then your boss's message. A bonus bigger than a year's pay. Mark which of a rival campaign's supporters are real. It arrives with a dot.": "[quiet, tempted, then dry on the last sentence] Then your boss's message. A bonus bigger than a year's pay. Mark which of a rival campaign's supporters are real. It arrives with a dot."
"Your father, under your mother's homecoming plans. No dot. The only bare bubble in twenty.": "[soft, a lump in it] Your father, under your mother's homecoming plans. No dot. The only bare bubble in twenty."
"If a machine wrote it but they meant it, does it still count? Because a dot never says why.": "[the question put straight to you, slow, then plain] If a machine wrote it but they meant it, does it still count? Because a dot never says why."
"Sell what you see, and every fake gets a price on its head. So does every night-shift worker who let a machine finish a sentence. Keep it, and every tired person keeps their machine.": "[even, both sides weighed, no hint of the answer] Sell what you see, and every fake gets a price on its head. So does every night-shift worker who let a machine finish a sentence. Keep it, and every tired person keeps their machine."
"Manager: There's nothing there.": "[flat, puzzled, handing it back] There's nothing there."
"You walk out.": "[quiet, a door closing] You walk out."
"You walk out with the dots still yours. On the roof, you look at what keeping them protects.": "[quiet, resolved, then wide] You walk out with the dots still yours. On the roof, you look at what keeping them protects."
"Around the turn of the century, the Philippines was called the texting capital of the world. By 2008, Filipinos sent over a billion texts a day.": "[awe, slow, the number landing alone] Around the turn of the century, the Philippines was called the texting capital of the world. By two thousand and eight, Filipinos sent over a billion texts a day."
"Every lit window is a chat. From up here, you can see the dots.": "[hushed, wide, a little afraid] Every lit window is a chat. From up here, you can see the dots."
"Now take away the dotted ones.": "[very quiet, a dare to yourself] Now take away the dotted ones."
"Those are the people typing. Everyone else is asleep, or working, or scared of getting it wrong.": "[awe, hushed, tender on the last clause] Those are the people typing. Everyone else is asleep, or working, or scared of getting it wrong."
"Your phone buzzes. A calendar reminder you never set.": "[puzzled, quiet, a hook] Your phone buzzes. A calendar reminder you never set."
"You delete it. At nine you go anyway.": "[dry, then a decision, warm] You delete it. At nine you go anyway."
"Best friend: You booked this?": "[surprised, wary, hopeful] You booked this?"
"Best friend: ...Neither did I.": "[slow, a dawning, almost a laugh] Neither did I."
"The best conversation of your year. Midnight, three months ago, the night you made up after the fight.": "[wonder, slow, fond on the last clause] The best conversation of your year. Midnight, three months ago, the night you made up after the fight."
"Every line. Both sides. Dotted.": "[flat, each word alone, the floor gone] Every line. Both sides. Dotted."
"Her instruction. Yours. Two machines, told the same thing by two people who were asleep, booked a cafe.": "[wonder, a laugh starting under it] Her instruction. Yours. Two machines, told the same thing by two people who were asleep, booked a cafe."
"In a 2023 study, people who suspected their chat partner was using AI-suggested replies judged them more harshly. But actually using them made the conversation warmer and closer. The use never hurt the conversation. The suspicion did.": "[calm, exact, the last two sentences slow and plain] In a twenty twenty-three study, people who suspected their chat partner was using AI-suggested replies judged them more harshly. But actually using them made the conversation warmer and closer. The use never hurt the conversation. The suspicion did."
"You said a machine can't mean it.": "[quiet, the old line held up to the light] You said a machine can't mean it."
"Nobody wrote it. Both of you meant it.": "[warm, slow, a complete thought] Nobody wrote it. Both of you meant it."
"Your father's message. Two weeks old. You were going to write something long. Something worthy.": "[quiet, guilty, the last two words a little mocking of yourself] Your father's message. Two weeks old. You were going to write something long. Something worthy."
"Three words. One of them wrong. Your thumb goes to fix it.": "[hushed, slow, a held breath on the last sentence] Three words. One of them wrong. Your thumb goes to fix it."
"You leave it.": "[very soft, the breath let go] You leave it."
"Send. No dot.": "[quiet, bare] Send. No dot."
"Mother: He never could spell.": "[fond, not turning round, a smile in it] He never could spell."
"No paragraph. No grade. No fix.": "[warm, each fragment lighter] No paragraph. No grade. No fix."
"Tomorrow someone will send you three words with a mistake in them. Read them twice. Nobody else could have sent them.": "[tender, close, a complete thought on the last sentence] Tomorrow someone will send you three words with a mistake in them. Read them twice. Nobody else could have sent them."
"So, would you fix the typo? Tell us in the comments. And if you'd have done the same, hit like and subscribe.": "[warm, direct, a small smile] So, would you fix the typo? Tell us in the comments. And if you'd have done the same, hit like and subscribe."
