# Cue sheet, G2 intent (rules/sound.md #1); final spotting at G4. Owner on v3 (2026-11-13): "better sound in the video
# just to break the continuous background music flowing throughout the video which might be monotonous". So the score
# changes with each section (scenes/sound.ts places it) and every set has its own two-layer ambience bed
# (scenes/make_ambience.py). Levels: rules/sound.md #4 (about 26 dB under the voice, about 8 dB under in holds),
# unchanged; beds about 30 dB under the voice and about 8 dB under the hold music. Each section's music and bed start
# under the cut, 1.0 s and 0.5 s early (sound #7).
# Rights (sound #11): theme-light and theme-dark are the channel themes (Eleven Music v2.5 via Higgsfield, U1 cleared);
# every cue_* is made locally by ACE-Step 1.5 (make_music.py) with a theme as reference_audio (U2, owner 2026-11-09
# "Yes, keep it"); beds and effects are synthesised (make_ambience.py, make_sfx.sh). No paid call.
# Rule device sound (sound #8): the card's paper snap as it unfolds, the split-flap flutter and click as it settles.
beats:
  - {beat: The Platform, intent: hook, music_in: "theme-light from frame 0 (the channel signal)", music_out: "into cue_wonder as the card first opens", level: "hold level in the skit", bed: platform, fx: [board flutter and click, letter tear, card snap]}
  - {beat: Made the Cut, intent: wonder, music_in: "cue_wonder (pizzicato, celesta, ticking)", music_out: "-", level: "-26 dB under voice", bed: "classroom, then the academy street at night", fx: [card snap per reading]}
  - {beat: The Rule, intent: wonder, music_in: "cue_wonder continues", music_out: "into cue_hunt at Who's Red", level: "-26 dB", bed: "near-silence on the card, then the store (fridges, fluorescent buzz)", fx: [card unfolds, flutter on the scale]}
  - {beat: Who's Red, intent: nosy, music_in: "cue_hunt (plucked strings, muted marimba)", music_out: "into cue_home at her back", level: "-26 dB", bed: "classroom, street by day, the bus, the academy steps", fx: [card snap per reading]}
  - {beat: Her Back, intent: tender, music_in: "cue_home (solo felt piano)", music_out: "into cue_crowd", level: "-26 dB; the doorway hold at -8 dB", bed: home, fx: [snap-soft on her card]}
  - {beat: A Thousand Cards, intent: vast, music_in: "cue_crowd (high strings, music box)", music_out: "-", level: "-26 dB", bed: "the academy street at night", fx: [card flutter in the crowd]}
  - {beat: Four in a Hundred, intent: narrowing, music_in: "cue_crowd tightens", music_out: "into cue_friend at the notebook", level: "-26 dB", bed: "classroom, the store", fx: []}
  - {beat: The Notebook, intent: warm, music_in: "cue_friend (felt piano and cello)", music_out: "into cue_dread at the cost", level: "-26 dB; the notebook hold at -8 dB", bed: "the late-night study room (lamp hum)", fx: [pages]}
  - {beat: Say It Again, intent: dread, music_in: "cue_dread (slow ticking pulse, low strings) after the cost line, not before", music_out: "-", level: "-26 dB", bed: home, fx: []}
  - {beat: The Country Holds Its Breath, intent: hush, music_in: "cue_dread continues", music_out: "into cue_ache", level: "-26 dB", bed: "classroom, the hushed city, the exam hall", fx: []}
  - {beat: A Text Would Open Nothing, intent: lonely, music_in: "cue_ache (sparse felt piano)", music_out: "into theme-dark-thin", level: "-26 dB", bed: "home and classroom by shot, then the bus", fx: []}
  - {beat: The Loading Dock, intent: peak, music_in: "theme-dark thinned (the signal, thinner at the cost, sound #2)", music_out: "drops to a floor with one held low note across the 9 s wordless peak, then comes back in once (sound #3)", level: "-26 dB; the floor about 10% of hold level", bed: "the dock (wind, the city far off)", fx: [meter snap, soft]}
  - {beat: Two Letters, intent: resolve, music_in: "cue_resolve (piano and soft strings, morning)", music_out: "theme-light on the end card", level: "-26 dB; end card at hold level", bed: home, fx: [card snap, soft]}
planned_silences: []   # none; the dock peak is a floor with one note, not silence
