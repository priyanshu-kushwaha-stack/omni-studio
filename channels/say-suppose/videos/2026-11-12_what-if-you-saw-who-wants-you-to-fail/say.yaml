# say.yaml: one entry per spoken line of script.md v2. Key = the spoken line exactly, citations removed.
# Value = "[emotion, delivery] words with numbers spelled out, name prefix dropped".
# Repeated character lines ("Say it again.", "Half?") appear once; their returns are directed in the comment above each.

"Ten o'clock. The academy doors open, and you've been holding this since four.": "[breathless, close, a grin in the voice] Ten o'clock. The academy doors open, and you've been holding this since four."
"What if you could see who wants you to fail?": "[quiet, level, the question laid down after the hug] What if you could see who wants you to fail?"
"Because that's your best friend. And that's minus eighty-four.": "[flat, hurt, each sentence its own breath] Because that's your best friend. And that's minus eighty-four."
"Since this morning, a card opens over anyone who hears your good news. You've told no one all day.": "[matter-of-fact, intimate] Since this morning, a card opens over anyone who hears your good news. You've told no one all day."
"Not because of the cards. Because he hears everything first. He always has.": "[warm, fond, a little slower on the last three words] Not because of the cards. Because he hears everything first. He always has."
# Min-jun, the best friend: his own voice, over the hug, muffled against a shoulder.
"Min-jun: Knew it. Knew it.": "[delighted, breathless, boyish, half shouted into your shoulder] Knew it. Knew it."
"Sixty seconds. The card folds shut. His arm stays. So does the number.": "[hushed, dry, the last four words slower] Sixty seconds. The card folds shut. His arm stays. So does the number."
"The rule, once. Say good news out loud, to a face, and a meter opens over whoever hears it, for sixty seconds, from plus one hundred to minus one hundred.": "[dry, exact, teacherly for one line] The rule, once. Say good news out loud, to a face, and a meter opens over whoever hears it, for sixty seconds, from plus one hundred to minus one hundred."
"Plus one hundred: pure joy for you. Minus one hundred: they want you to fail.": "[even, a beat between the two halves] Plus one hundred: pure joy for you. Minus one hundred: they want you to fail."
"It never says why. Only out loud. Only to a face. A call, a text, a post: nothing opens. Remember that.": "[measured, clipped, the last two words leaned on] It never says why. Only out loud. Only to a face. A call, a text, a post: nothing opens. Remember that."
# Min-jun: the store at 0:55 (easy, every-night); the counter at 4:20 (same offer, a shade quieter); results day at 7:35 (lighter, a grin in it).
"Every night, one chocolate bar, two halves. You take yours and watch him chew.": "[warm, amused, slow] Every night, one chocolate bar, two halves. You take yours and watch him chew."
"Your phone. Your sister. Six years of night shifts at a warehouse to pay for that classroom. You tell her.": "[softer, close, the middle sentence weighted] Your phone. Your sister. Six years of night shifts at a warehouse to pay for that classroom. You tell her."
# Ji-yoon, the sister: the phone at 1:15 (laughing, delighted, over forklift noise); her back at 2:50 (light, over her shoulder, teasing); the table at 5:50 (into your scarf, through tears, twice: the first bright and broken, the second smaller, pleading); the dock at 8:25 (quiet, steady, asking for real).
"Ji-yoon: Say it again.": "[bright, laughing, hungry for it] Say it again."
"You do. You're grinning into a phone. Nothing opens over a phone. So you still don't know her number.": "[fond, then dry on the last sentence] You do. You're grinning into a phone. Nothing opens over a phone. So you still don't know her number."
"Next morning. You've worked it out. Red is for enemies. So you test it on one.": "[brisk, amused, a plan in the voice] Next morning. You've worked it out. Red is for enemies. So you test it on one."
"The rival. Trash-talks you every morning, two years running.": "[dry, half a smile] The rival. Trash-talks you every morning, two years running."
# Tae-ho, the rival: bored, not looking up.
"Tae-ho: Still here?": "[bored, flat, a sneer without effort] Still here?"
"You hold up the letter.": "[quick, expectant] You hold up the letter."
"Minus six. He barely looks up.": "[deflated, amused at the deflation] Minus six. He barely looks up."
"Tae-ho: Nice. Move.": "[flat, two words, already walking] Nice. Move."
"Your maths teacher.": "[quick, a new test] Your maths teacher."
# Ms. Kang, the maths teacher: one word, not unkind, already back to the board.
"Ms. Kang: Good.": "[brief, warm underneath, clipped] Good."
"That's all you get. And it's plus forty-one.": "[surprised, a small laugh] That's all you get. And it's plus forty-one."
"So the enemy doesn't care. Why?": "[curious, leaning in] So the enemy doesn't care. Why?"
"We measure ourselves against people near our own level, not far above or below.": "[plain, exact, unhurried] We measure ourselves against people near our own level, not far above or below."
"And envy picks someone who started where you did, in a thing that matters to you.": "[plain, a shade quieter] And envy picks someone who started where you did, in a thing that matters to you."
"But here's the problem. Problem one: the only people who can bleed at your news are the ones in your lane. The same race.": "[a turn, tighter, the hook line] But here's the problem. Problem one: the only people who can bleed at your news are the ones in your lane. The same race."
"So you ask him, on the academy steps.": "[light, a shrug] So you ask him, on the academy steps."
"He can't see it. Nobody sees the cards but you.": "[quiet, the second sentence slower] He can't see it. Nobody sees the cards but you."
"And people don't like to admit being maliciously envious, even to themselves.": "[dry, gentle] And people don't like to admit being maliciously envious, even to themselves."
"So you have a number. And no one to ask.": "[flat, alone, the loop left open] So you have a number. And no one to ask."
"Eleven. Home. The letter's already on the fridge, next to the jar where her paintbrushes have stood for six years.": "[hushed, tired, slowing on the brushes] Eleven. Home. The letter's already on the fridge, next to the jar where her paintbrushes have stood for six years."
"She's in the doorway, pulling on her work vest. She doesn't turn round.": "[soft, observational] She's in the doorway, pulling on her work vest. She doesn't turn round."
"You say it to her back. Nothing opens. A back is not a face.": "[dry, exact, the rule remembered] You say it to her back. Nothing opens. A back is not a face."
"She laughs, and she's gone. And she still hasn't seen your face say it. Not yet.": "[warm, then a shade darker on the last two words] She laughs, and she's gone. And she still hasn't seen your face say it. Not yet."
"Minus six for the rival. So maybe the number fades the further someone is from your lane.": "[thinking aloud, curious] Minus six for the rival. So maybe the number fades the further someone is from your lane."
"And Seoul lets them teach only until ten at night. Inspectors have patrolled the streets to make sure.": "[dry, a smile at the inspectors] And Seoul lets them teach only until ten at night. Inspectors have patrolled the streets to make sure."
"So at ten, every door on the street opens at once.": "[building, slower, setting the picture] So at ten, every door on the street opens at once."
"So you climb the academy steps and say it into the crowd.": "[a breath held, then released on the last word] So you climb the academy steps and say it into the crowd."
"A thousand strangers. A thousand zeros. A few teal. And three red. All by the snack shop. All from your class.": "[hushed, awed, counting, the last two sentences cold] A thousand strangers. A thousand zeros. A few teal. And three red. All by the snack shop. All from your class."
"So. Minus means they want you to fail. And now you know exactly who to cut.": "[hard, decided, wrong] So. Minus means they want you to fail. And now you know exactly who to cut."
"So the meter becomes a weapon.": "[cold, quiet] So the meter becomes a weapon."
"Two weeks. Each mock score, you stand up, say it out loud, and read the room. Anyone who goes red, you stop helping. Stop lending notes.": "[brisk, clipped, a montage voice] Two weeks. Each mock score, you stand up, say it out loud, and read the room. Anyone who goes red, you stop helping. Stop lending notes."
"And every night at the counter:": "[a half-line, leading in] And every night at the counter:"
"You climb.": "[flat, two words] You climb."
"But the higher you go, the redder the room.": "[darker, slower] But the higher you go, the redder the room."
"When someone close beats you at something central to who you are, the closer they are, the sharper it cuts.": "[plain, exact, the last three words slower] When someone close beats you at something central to who you are, the closer they are, the sharper it cuts."
"And his number keeps going down.": "[quiet, the loop] And his number keeps going down."
"You got the place you wanted. And lost the one beside it.": "[flat, hollow, the win and the cost in one breath] You got the place you wanted. And lost the one beside it."
"The late-night study room. Past midnight. His seat's empty, and his notebook's open.": "[hushed, close, one lamp] The late-night study room. Past midnight. His seat's empty, and his notebook's open."
"He isn't sawing your chair. He's climbing.": "[quiet, the turn, a breath before the second sentence] He isn't sawing your chair. He's climbing."
"Envy comes in two kinds. One pushes you to move up. The other pushes you to pull the other person down.": "[plain, exact, even] Envy comes in two kinds. One pushes you to move up. The other pushes you to pull the other person down."
"Minus never meant they want you to fail. It meant it hurt.": "[low, the planted line broken, slow] Minus never meant they want you to fail. It meant it hurt."
"In one brain-scan study, envying a peer who did better at something that mattered came with activity in a region also active in pain.": "[plain, careful, unhurried] In one brain-scan study, envying a peer who did better at something that mattered came with activity in a region also active in pain."
"A card has one colour for every kind of hurt.": "[quiet, complete, the landing line] A card has one colour for every kind of hurt."
"But here's the second problem. Problem two: hurt needs a lane. Outside yours, nobody bleeds.": "[a turn, tighter, the hook] But here's the second problem. Problem two: hurt needs a lane. Outside yours, nobody bleeds."
"And you've only ever read one lane.": "[soft, ominous, the loop] And you've only ever read one lane."
"The school confirms it. Four years, paid. If the exam holds.": "[bright, quick, a catch on the last clause] The school confirms it. Four years, paid. If the exam holds."
"For once you run home instead of to the store.": "[warm, breathless, running] For once you run home instead of to the store."
"Your sister's at the table. A night off. You say it to her face.": "[tender, then a held breath on the last sentence] Your sister's at the table. A night off. You say it to her face."
"Minus sixty-eight. Over the one person who ever asked to hear it twice.": "[stunned, flat, slow] Minus sixty-eight. Over the one person who ever asked to hear it twice."
"You can't.": "[barely voiced] You can't."
"You just watched a card say what her arms didn't.": "[quiet, bitter, slow] You just watched a card say what her arms didn't."
"You take your bag. And you don't go home. Not that night. Not for a month.": "[flat, each fragment colder] You take your bag. And you don't go home. Not that night. Not for a month."
"A week in the study room. You say nothing good out loud, to anyone, and the cards go quiet, because you have.": "[hushed, tired, the last clause slower] A week in the study room. You say nothing good out loud, to anyone, and the cards go quiet, because you have."
"The night before the exam. Your own notebook. Every mistake this year, and why. Leave it, or keep your place?": "[quiet, a real question, no pause after it] The night before the exam. Your own notebook. Every mistake this year, and why. Leave it, or keep your place?"
"You leave it on his desk. Half a chocolate bar on top.": "[soft, decided, a small smile on the chocolate] You leave it on his desk. Half a chocolate bar on top."
"Exam day.": "[a breath, two words] Exam day."
"A country holds its breath for you.": "[quiet, complete] A country holds its breath for you."
"At your gate, in the crowd of parents: the work vest. Straight off the night shift.": "[soft, a catch on the vest] At your gate, in the crowd of parents: the work vest. Straight off the night shift."
"Neither of you says a word. Nothing opens.": "[hushed, tender] Neither of you says a word. Nothing opens."
"Results come in a month. For a month, you say nothing to anyone.": "[level, the loop, slower on the second sentence] Results come in a month. For a month, you say nothing to anyone."
"Results. Top grade. Top grade. Top grade. The scholarship holds.": "[tight, then released, each top grade a beat] Results. Top grade. Top grade. Top grade. The scholarship holds."
"Your best friend, beside you: top grade in maths too.": "[warm, a grin] Your best friend, beside you: top grade in maths too."
"You take it.": "[soft, three words, a smile] You take it."
"Her brushes have stood in a jar for six years.": "[quiet, landing on her] Her brushes have stood in a jar for six years."
"Text her, and never see her colour again. Or take the bus to the warehouse and say it to her face.": "[level, the dilemma, both halves given equal weight] Text her, and never see her colour again. Or take the bus to the warehouse and say it to her face."
"A text would open nothing. You could keep her forever on a screen.": "[low, tempting, slow] A text would open nothing. You could keep her forever on a screen."
"You're on the bus.": "[decided, quick, no pause before it] You're on the bus."
"Six o'clock. Her shift ends. You stand on the loading dock. And you say it.": "[hushed, steady, a breath before the last sentence] Six o'clock. Her shift ends. You stand on the loading dock. And you say it."
"The same.": "[flat, two words, no surprise] The same."
"She holds on. And this time you don't go stiff.": "[warm, slow, the turn in your body] She holds on. And this time you don't go stiff."
"You said nobody outside your lane bleeds.": "[low, after the silence, the planted line brought back] You said nobody outside your lane bleeds."
"She was never outside your lane. She was in it first.": "[quiet, complete, the landing line, slow] She was never outside your lane. She was in it first."
"Six years ago it was her letter on the fridge.": "[soft, a picture] Six years ago it was her letter on the fridge."
"At the 1992 Olympics, bronze medallists looked happier than silver. Silver thinks of the gold it nearly won. Bronze thinks of nearly winning nothing.": "[plain, exact, gentle, slower through the last two sentences] At the nineteen ninety-two Olympics, bronze medallists looked happier than silver. Silver thinks of the gold it nearly won. Bronze thinks of nearly winning nothing."
"She's not watching you fail. She's watching the life she handed you walk up the dock with the news. And she wants it in.": "[tender, slow, the last sentence almost whispered] She's not watching you fail. She's watching the life she handed you walk up the dock with the news. And she wants it in."
"The same number. The same arms. You hold on through the second sixty.": "[quiet, steady, complete] The same number. The same arms. You hold on through the second sixty."
"Morning. The fridge. She unpins the calendar, and behind it is a letter. Hers. Six years old.": "[hushed, morning-light, slow on the last three words] Morning. The fridge. She unpins the calendar, and behind it is a letter. Hers. Six years old."
"Tomorrow someone you love will pause half a second before they say congratulations.": "[quiet, to the viewer, slow] Tomorrow someone you love will pause half a second before they say congratulations."
"That half-second is the other life, going past.": "[hushed, complete, the residue] That half-second is the other life, going past."
"Then the door. Your best friend. A letter of his own. He says it. For the first time, the good news isn't yours.": "[light, quick, a smile that is about to stop] Then the door. Your best friend. A letter of his own. He says it. For the first time, the good news isn't yours."
"So, would you still say it to her face? Tell us in the comments. And if you'd have done the same, hit like and subscribe.": "[warm, direct, unhurried, no hype] So, would you still say it to her face? Tell us in the comments. And if you'd have done the same, hit like and subscribe."

"You do.": "[barely there, close] You do."

"The exam grades on a curve. In most subjects, only the top 4 per cent get the top grade.": "[plain, exact] The exam grades on a curve. In most subjects, only the top four per cent get the top grade."
"So you picture your class. A hundred of you. Four places. You're fourth. He's fifth.": "[quiet, counting it out, the last two words close] So you picture your class. A hundred of you. Four places. You're fourth. He's fifth."
"Last year, the country grounded its planes for 35 minutes during the English listening test. This year, you're the one listening.": "[hushed, awed, then close and personal] Last year, the country grounded its planes for thirty-five minutes during the English listening test. This year, you're the one listening."
"This one neighbourhood in Seoul has about a thousand after-school academies.": "[dry, a little amazed] This one neighbourhood in Seoul has about a thousand after-school academies."

"The rival is twenty places ahead and throws that line at everyone. Your best friend has the next desk, the same chocolate bar, the same exam.": "[dry, then quieter on the second half] The rival is twenty places ahead and throws that line at everyone. Your best friend has the next desk, the same chocolate bar, the same exam."
"For once, silence leaves both of you in the room.": "[soft, close, warm] For once, silence leaves both of you in the room."
"In studies of regret, the most common is education: about a third of all regrets.": "[quiet, careful, looking out of the window] In studies of regret, the most common is education: about a third of all regrets."
