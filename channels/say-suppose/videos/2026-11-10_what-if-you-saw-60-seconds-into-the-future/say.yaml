# What each script line speaks: the direction in square brackets (emotion, level and pace; also the per-line delivery
# for the free narration), numbers spelled out. A character's line drops its "Grandpa:" / "Mom:" prefix: the name
# is not spoken. Keys must match a spoken line of script.md. Written by Claude Opus 5.5 with the script (v3, 2026-11-11).

"You check everything before it happens.": "[intimate, close, almost amused] You check everything before it happens."
"The bus. The result. Her dots.": "[close, hushed, a little wondering] The bus. The result. Her dots."
"And the glass.": "[a quick catch of breath] And the glass."
"It's still there.": "[hushed, disbelieving] It's still there."
"What if you saw sixty seconds into the future?": "[low, curious, slow] What if you saw sixty seconds into the future?"
"You have one minute. You've always had one minute. You just never knew it.": "[slow, a smile in it, landing] You have one minute. You've always had one minute. You just never knew it."
"Never late again. Never wrong-footed.": "[close, hushed, a little wondering] Never late again. Never wrong-footed."
"You'll never be caught out again. That's the gift.": "[warm, a little too pleased] You'll never be caught out again. That's the gift."
"And nothing will ever be new again. Small price.": "[wry, offhand] And nothing will ever be new again. Small price."
"Everything you look at has a ghost. The same street, one minute on.": "[confiding, easy] Everything you look at has a ghost. The same street, one minute on."
"It shows what happens if you do nothing.": "[confiding, easy] It shows what happens if you do nothing."
"Move, and it redraws.": "[confiding, easy] Move, and it redraws."
"Only a minute. Past that, everyone's reaction has already changed it.": "[confiding, easy] Only a minute. Past that, everyone's reaction has already changed it."
"And there's no off switch.": "[flat, a beat late] And there's no off switch."
"But the minute's up. The real glass goes.": "[dry, amused] But the minute's up. The real glass goes."
"You catch it. The saucer goes instead.": "[dry, amused] You catch it. The saucer goes instead."
"Chai-wallah: Saucer is extra, boss.": "[gruff, deadpan street vendor] Saucer is extra, boss."
"Next day, the canteen. Cricket on the TV, and the TV has a ghost too.": "[quick, deadpan, amused] Next day, the canteen. Cricket on the TV, and the TV has a ghost too."
"Six.": "[deadpan, certain] Six."
"Friend: How did you know?": "[loud, amazed] How did you know?"
"They stop watching with you.": "[quiet, a little sad, dry] They stop watching with you."
"The batter on that screen has it worse. The fastest balls reach him in under half a second.": "[quick, deadpan, amused] The batter on that screen has it worse. The fastest balls reach him in under half a second."
"So the best batters read the bowler's hand and arm before the ball is even let go, and get ready early.": "[quick, deadpan, amused] So the best batters read the bowler's hand and arm before the ball is even let go, and get ready early."
"They guess, from the body. You don't have to guess.": "[quick, deadpan, amused] They guess, from the body. You don't have to guess."
"And you're the only one in the room not watching.": "[quiet, rueful] And you're the only one in the room not watching."
"Your boss is typing. Well. His ghost is.": "[dry, amused] Your boss is typing. Well. His ghost is."
"You send the deck before he's even asked for it.": "[quick, deadpan, amused] You send the deck before he's even asked for it."
"Boss: Great. Since you're free...": "[cheerful, too eager] Great. Since you're free..."
"Every morning, the platform plays twice.": "[hushed, awed] Every morning, the platform plays twice."
"You know which seat will be empty.": "[quick, deadpan, amused] You know which seat will be empty."
"So does the man who watched you walk to it.": "[dry, a beat late] So does the man who watched you walk to it."
"You saw a minute ahead and still arrived late. Seeing always does.": "[dry, then quieter] You saw a minute ahead and still arrived late. Seeing always does."
"What you see is already old. Your brain takes about a tenth of a second to process it.": "[hushed, curious, slow] What you see is already old. Your brain takes about a tenth of a second to process it."
"Even this hand is a little bit ago.": "[whispered, wondering] Even this hand is a little bit ago."
"There's a trick of the eye called the flash-lag illusion. A light flashes level with a moving dot, but the dot looks ahead of it.": "[hushed, curious, slow] There's a trick of the eye called the flash-lag illusion. A light flashes level with a moving dot, but the dot looks ahead of it."
"Some scientists think your brain guesses forward to cover the gap.": "[hushed, curious, slow] Some scientists think your brain guesses forward to cover the gap."
"Even that sliver makes now uncertain. Yours is a full minute.": "[slow, low, letting it land] Even that sliver makes now uncertain. Yours is a full minute."
"Sundays are grandfather's.": "[warm, fond] Sundays are grandfather's."
"And grandfather has one story.": "[warm, fond] And grandfather has one story."
"Grandpa: A borrowed bicycle, a wedding...": "[old, delighted with himself, a storyteller] A borrowed bicycle, a wedding..."
"The bicycle. The wedding. The wrong bride's house. You've heard it all your life.": "[warm, fond] The bicycle. The wedding. The wrong bride's house. You've heard it all your life."
"This time, you hear the ending a minute early.": "[warm, fond] This time, you hear the ending a minute early."
"And you laugh exactly on time. Too exactly.": "[light, then a small doubt] And you laugh exactly on time. Too exactly."
"Mom calls you twice a day. You've started answering before she asks.": "[warm, light] Mom calls you twice a day. You've started answering before she asks."
"Yes, you ate. Yes, you'll sleep early. No, the result isn't out.": "[warm, light] Yes, you ate. Yes, you'll sleep early. No, the result isn't out."
"Mom: You know me too well.": "[warm, bustling] You know me too well."
"Mom: Are you okay?": "[warm, bustling] Are you okay?"
"You saw this one coming too. You still don't have an answer.": "[soft, slow] You saw this one coming too. You still don't have an answer."
"At home, Mom has started stopping halfway through her sentences.": "[quiet, flat] At home, Mom has started stopping halfway through her sentences."
"Because you keep finishing them.": "[quiet, flat] Because you keep finishing them."
"So you try something that can't look back at you. Your cousin's coin. You call it ten times in a row.": "[sly, a little bitter, quick] So you try something that can't look back at you. Your cousin's coin. You call it ten times in a row."
"Cousin: Not playing with you.": "[sulky, young] Not playing with you."
"It works. Until the other person notices.": "[sly, quick] It works. Until the other person notices."
"At the office Diwali party, you can see every hand a minute before it's played.": "[sly, quick] At the office Diwali party, you can see every hand a minute before it's played."
"You bet. And they fold, because you bet.": "[sly, quick] You bet. And they fold, because you bet."
"They stop dealing you in.": "[sly, quick] They stop dealing you in."
"Two physics students, Doyne Farmer and Norman Packard, once built a computer to beat roulette, and later hid it in a shoe.": "[sly, quick] Two physics students, Doyne Farmer and Norman Packard, once built a computer to beat roulette, and later hid it in a shoe."
"Farmer says it gave them about a twenty percent edge over the house. But the hardware kept failing.": "[sly, quick] Farmer says it gave them about a twenty percent edge over the house. But the hardware kept failing."
"Your hardware never fails. It's everyone else that changes.": "[dry, then quieter] Your hardware never fails. It's everyone else that changes."
"So far you've acted as if seeing it means knowing it.": "[low, flat, slow] So far you've acted as if seeing it means knowing it."
"She turns at your voice. And knocks the pan.": "[quick, then a drop] She turns at your voice. And knocks the pan."
"Her hand is fine. She doesn't speak to you again that evening.": "[flat, very quiet] Her hand is fine. She doesn't speak to you again that evening."
"Sociologists have a name for a forecast that stops itself coming true: a self-defeating prophecy.": "[low, flat, slow] Sociologists have a name for a forecast that stops itself coming true: a self-defeating prophecy."
"That's all the ghost ever was. Not the future. A rumour about a world where you stood still.": "[slow, low, certain] That's all the ghost ever was. Not the future. A rumour about a world where you stood still."
"Every Sunday since, you've heard the bicycle story twice. Once a minute early. Once on time.": "[quiet, close] Every Sunday since, you've heard the bicycle story twice. Once a minute early. Once on time."
"This time you laugh one second early.": "[quiet, tense] This time you laugh one second early."
"Grandpa: You've heard it.": "[old, delighted with himself, a storyteller] You've heard it."
"He does not finish.": "[almost a whisper] He does not finish."
"Later, he tells it to your cousin instead. You listen from the kitchen.": "[quiet, close] Later, he tells it to your cousin instead. You listen from the kitchen."
"Grandpa wants to see your college. His first ride on the metro.": "[tight, fast, urgent] Grandpa wants to see your college. His first ride on the metro."
"Grandpa: So many people!": "[old, delighted with himself, a storyteller] So many people!"
"You steer him to the door you saw. In the ghost, he follows your hand, and the crowd takes him down at the gap.": "[tight, fast, urgent] You steer him to the door you saw. In the ghost, he follows your hand, and the crowd takes him down at the gap."
"You pull him left. It redraws. Worse.": "[fast, breathless] You pull him left. It redraws. Worse."
"You call his name. He turns to your voice, and steps into it.": "[fast, breaking] You call his name. He turns to your voice, and steps into it."
"Every move you make, he follows. And the minute moves with him.": "[tight, low] Every move you make, he follows. And the minute moves with him."
"In Japan, the bullet train lines have their own quake sensors. When the first tremor warns of shaking to come, they cut the power and the train brakes itself.": "[steady, low] In Japan, the bullet train lines have their own quake sensors. When the first tremor warns of shaking to come, they cut the power and the train brakes itself."
"That's what a little future is for. Not a winning hand. A stop.": "[warm, steady] That's what a little future is for. Not a winning hand. A stop."
"A weather scientist, Edward Lorenz, once reran a computer weather model with one number rounded off, and got a completely different forecast.": "[steady, low] A weather scientist, Edward Lorenz, once reran a computer weather model with one number rounded off, and got a completely different forecast."
"Tiny changes don't stay tiny.": "[steady, low] Tiny changes don't stay tiny."
"A ghost of next week would be rumour on rumour. One minute is enough.": "[steady, low] A ghost of next week would be rumour on rumour. One minute is enough."
"Grandpa: Did I ever tell you...": "[old, delighted with himself, a storyteller] Did I ever tell you..."
"Watch him, or hear him?": "[almost a whisper, close] Watch him, or hear him?"
"Grandpa: ...the wrong bride's house!": "[old, delighted with himself, a storyteller] ...the wrong bride's house!"
"You laugh late. Loud. With your cousin.": "[warm, bright, a laugh in it] You laugh late. Loud. With your cousin."
"Your dopamine cells fire for a reward better than you expected. For one you saw coming, they stay flat.": "[warm, opening up] Your dopamine cells fire for a reward better than you expected. For one you saw coming, they stay flat."
"Being caught out was the gift.": "[slow, warm, landing] Being caught out was the gift."
"The ghost never gave you a new sense. It turned up one you already had, until it drowned out the thing it was for.": "[warm, opening up] The ghost never gave you a new sense. It turned up one you already had, until it drowned out the thing it was for."
"Friday. The result is out. Her dots are typing.": "[quiet, sure, warm] Friday. The result is out. Her dots are typing."
"You let them.": "[soft, sure] You let them."
