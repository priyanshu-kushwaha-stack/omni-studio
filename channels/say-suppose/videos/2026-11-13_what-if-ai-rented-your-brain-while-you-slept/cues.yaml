# Cue sheet, G2 intent (rules/sound.md #1); final spotting at G4. From the owner's note on the last film (2026-11-13):
# "better sound in the video just to break the continuous background music flowing throughout the video which might be
# monotonous". So the score changes with each section (scenes/sound.ts places it) and every set has its own ambience
# bed (scenes/make_ambience.py). Levels: rules/sound.md #4 (about 26 dB under the voice, about 8 dB under in holds),
# unchanged; beds about 30 dB under the voice. Each section's music and bed start under the cut, 1.0 s and 0.5 s early.
# Rights (sound #11): theme-light and theme-dark are the channel themes; every cue is made locally by ACE-Step 1.5
# (make_music.py) with a theme as reference_audio (U2, owner 2026-11-09); beds and effects are synthesised. No paid call.
# Rule device sound (sound #8): the band's teal chime, the ghost's dry typing patter, the coin's clink in glass.
beats:
  - {beat: The Chair, intent: hook, music_in: "theme-light from frame 0 (the channel signal), at hold level under the skit", music_out: "into hush at Night One", bed: clinic, fx: [clock tick, chime, typing, one clink in a palm]}
  - {beat: Night One, intent: wonder, music_in: "hush (music box, celesta)", music_out: "into leaflet", level: "-26 dB under voice", bed: "bunk room at night", fx: [chime, typing, clinks into the jar, split-flap]}
  - {beat: The Rule, intent: curious, music_in: "leaflet (pizzicato, woodwinds)", music_out: "into crumbs", level: "-26 dB", bed: "kitchen morning", fx: [paper unfolding, three stamps]}
  - {beat: Crumbs, intent: comic, music_in: "crumbs (marimba, plucked strings)", music_out: "into boom", level: "-26 dB", bed: "kitchen, shower, the bridge at dawn", fx: [three bangs on the wall, spoon]}
  - {beat: More Hours, intent: greed to unease, music_in: "boom (speeding ostinato, glockenspiel coins)", music_out: "into unease", level: "-26 dB; the hundred-window hold at -8 dB", bed: "bus, office, street at dusk", fx: [a hundred keyboards, coins in glass]}
  - {beat: The Night Shift, intent: unease, music_in: "unease (low clarinet, tick)", music_out: "into photo", level: "-26 dB", bed: "bunk room at lamp", fx: [stamps]}
  - {beat: The Photo, intent: tender to loss, music_in: "photo (felt piano, cello)", music_out: "into market", level: "-26 dB", bed: "the hall, then the kitchen", fx: [split-flap]}
  - {beat: The Warehouses, intent: cold, music_in: "market (mechanical ostinato)", music_out: "into dread", level: "-26 dB", bed: "bridge at dusk, the warehouse hum", fx: [split-flap thrice, cots, typing in bulk]}
  - {beat: The Contract, intent: dread, music_in: "dread (ticking pulse)", music_out: "into awe", level: "-26 dB", bed: "kitchen at lamp, the clock", fx: [pen, hand on paper]}
  - {beat: One Mind, intent: awe, music_in: "awe (shimmering strings)", music_out: "drops to a floor with one held low note across the 9 s globe peak, then comes back in once (sound #3)", level: "-26 dB; the floor about 10% of hold level", bed: "bunk room at night", fx: [far-off typing under the peak]}
  - {beat: Midnight, intent: release, music_in: "release (sparse piano)", music_out: "into dawn", level: "-26 dB", bed: "bunk room at night, no typing", fx: [drawer, click, three knocks, footsteps]}
  - {beat: Morning, intent: resolve, music_in: "dawn (piano, strings)", music_out: "theme-light on the end card", level: "-26 dB; end card at hold level", bed: "bunk room morning, the clinic steps", fx: [tag peeled]}
planned_silences: []   # none; the globe peak is a floor with one note, not silence
