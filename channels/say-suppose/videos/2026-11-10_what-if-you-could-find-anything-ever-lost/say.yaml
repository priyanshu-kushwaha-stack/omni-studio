# What each script line speaks: the direction in square brackets (emotion, level and pace, the per-line delivery for the
# free local narration and the paid A/B later), numbers spelled out, citations removed, and a character line's
# "Grandfather:" / "Madhav:" / "Cousin:" prefix dropped (the name is not spoken). Keys are the spoken lines of
# script.md exactly as story.py reads them (citations removed). Madhav -> "Maadhav", tulsi -> "tulsee".

"Three pats. Phone, wallet, earbuds. Every door, every day.": "[close, rhythmic, a little amused, like a habit you'd never notice] Three pats. Phone, wallet, earbuds. Every door, every day."
"Except today, the third pat is empty.": "[quieter, the beat drops] Except today, the third pat is empty."
"You barely whisper it. And the floor answers.": "[hushed, breath in it, a small wonder] You barely whisper it. And the floor answers."
"What if you could find anything ever lost?": "[low, curious, intimate, a slow build] What if you could find anything ever lost?"
"Down there. With a coin. And someone's ring.": "[close, almost a whisper, delighted] Down there. With a coin. And someone's ring."
"Everything anyone ever lost. Even the things your family decided to lose.": "[lower, a shadow crosses it, slow] Everything anyone ever lost. Even the things your family decided to lose."
"The rule. Whisper the name of something lost.": "[plain, exact, leaning in] The rule. Whisper the name of something lost."
"If nobody alive knows where it is, a line draws itself from your shoes to it.": "[plain, exact, unhurried] If nobody alive knows where it is, a line draws itself from your shoes to it."
"One line at a time.": "[firm, a full stop] One line at a time."
"So. What do you go for first?": "[light, a grin in the voice, quick] So. What do you go for first?"
"Home. Your grandfather is looking at the empty hook by the door again. Where the orchard keys used to hang.": "[warm, tired, coming home out of the rain] Home. Your grandfather is looking at the empty hook by the door again. Where the orchard keys used to hang."
"Grandfather: Some things stay lost. Keeps the peace.": "[dry, old, gentle, a habit of saying it] Some things stay lost. Keeps the peace."
"Every Sunday, the same story. You and your cousin know it by heart.": "[warm, fond, a smile] Every Sunday, the same story. You and your cousin know it by heart."
"Grandfather: My brother took that deed.": "[old man, theatrical, the punchline of a story told a hundred times] My brother took that deed."
"First test: your cousin's stolen bicycle. Nothing.": "[dry, deadpan] First test: your cousin's stolen bicycle. Nothing."
"Of course. The thief knows exactly where it is.": "[amused, a shrug] Of course. The thief knows exactly where it is."
"So you try something nobody stole. Your mother's earring. Lost eight years ago, down the courtyard drain.": "[curious, picking up speed] So you try something nobody stole. Your mother's earring. Lost eight years ago, down the courtyard drain."
"The line goes up. Up the neem tree. Into a crow's nest.": "[rising, a laugh held back] The line goes up. Up the neem tree. Into a crow's nest."
"Her earring. And three that belong to strangers.": "[deadpan, delighted] Her earring. And three that belong to strangers."
"Therefore, the bazaar. Rain washes gold into these drains.": "[brisk, eager] Therefore, the bazaar. Rain washes gold into these drains."
"But you're not the first one here.": "[a turn, quieter, wry] But you're not the first one here."
"In the old gold bazaars, men still sift the drains in the early morning. For the dust the workshops wash away.": "[low, respectful, unhurried, a real place] In the old gold bazaars, men still sift the drains in the early morning. For the dust the workshops wash away."
"An old man is asking the whole lane for his hearing aid. You find it in a mango crate.": "[light, storytelling] An old man is asking the whole lane for his hearing aid. You find it in a mango crate."
"And the man who comes for it has the face from the folded photograph.": "[slower, the air changes, hushed] And the man who comes for it has the face from the folded photograph."
"Madhav: Your grandfather's eyes. Take a mango.": "[old man, warm, a little rough, holding something back] Your grandfather's eyes. Take a mango."
"Your great-uncle, Madhav. You say nothing at home.": "[quiet, careful, a secret] Your great-uncle, Maadhav. You say nothing at home."
"Then your cousin shows you the news. An old bungalow, coming down. The owner buried her coins somewhere in the compound. Her family has dug for a year.": "[brisk, gossipy, leaning in] Then your cousin shows you the news. An old bungalow, coming down. The owner buried her coins somewhere in the compound. Her family has dug for a year."
"You find them in ten minutes.": "[cocky, quick] You find them in ten minutes."
"Finders keepers. Right?": "[playful, a challenge] Finders keepers. Right?"
"The jeweller doesn't pay you. He asks for a bill.": "[flat, the deflation] The jeweller doesn't pay you. He asks for a bill."
"There's a law from 1878. Treasure found in the soil goes to the Collector.": "[dry, exact, slower] There's a law from eighteen seventy-eight. Treasure found in the soil goes to the Collector."
"In writing. Into the government treasury.": "[dry, exact, clipped] In writing. Into the government treasury."
"Keep quiet, and it's up to a year in prison.": "[low, dry, a beat of menace] Keep quiet, and it's up to a year in prison."
"You expected money. You get a receipt. And a queue.": "[wry, tired, a small laugh at yourself] You expected money. You get a receipt. And a queue."
"So you go for fortunes nobody is coming back for.": "[bigger, hungry, a new idea] So you go for fortunes nobody is coming back for."
"Cousin: A man threw out a hard drive. Bitcoin on it.": "[young, excited, reading off a phone] A man threw out a hard drive. Bitcoin on it."
"Dawn at the city dump. You whisper.": "[hushed, cold air, early] Dawn at the city dump. You whisper."
"The line goes two steps forward. Then straight down.": "[slow, a sinking] The line goes two steps forward. Then straight down."
"Since 2013, a man in Wales has asked to dig up the council's landfill. For one hard drive.": "[low, intimate, steady] Since twenty thirteen, a man in Wales has asked to dig up the council's landfill. For one hard drive."
"On it, the key to 8,000 bitcoin. A judge threw his case out.": "[quiet, plain] On it, the key to eight thousand bitcoin. A judge threw his case out."
"In 2025, he gave up.": "[softer, a door closing] In twenty twenty-five, he gave up."
"So, the sea. A wreck off the Konkan coast. The line runs straight into the water.": "[wind in it, wide, a little reckless] So, the sea. A wreck off the Konkan coast. The line runs straight into the water."
"Forty-one metres. Down.": "[almost a whisper, heavy] Forty-one metres. Down."
"An estimated three million shipwrecks lie on the ocean floor. And not one of them is a step closer.": "[quiet, vast, slow] An estimated three million shipwrecks lie on the ocean floor. And not one of them is a step closer."
"Knowing where was never the hard part.": "[very quiet, a truth, complete] Knowing where was never the hard part."
"But the one fortune still in reach is at home.": "[warmer, home, a small hope] But the one fortune still in reach is at home."
"Cousin: Find the deed. We're rich.": "[young, mouth full, joking] Find the deed. We're rich."
"Everyone laughs. Except your grandfather.": "[the laugh stops; quiet] Everyone laughs. Except your grandfather."
"And you think: it's in Madhav's house. The line will prove the story. You'll fix this family.": "[earnest, sure of yourself, a little too sure] And you think: it's in Maadhav's house. The line will prove the story. You'll fix this family."
"But the line doesn't go to the street.": "[slower, a frown in it] But the line doesn't go to the street."
"It crosses the living room. Out the back door. Across the courtyard.": "[tense, step by step, following it] It crosses the living room. Out the back door. Across the courtyard."
"To the tulsi he waters every morning.": "[hushed, stopped dead] To the tulsee he waters every morning."
"He's at the market.": "[quiet, careful, alone] He's at the market."
"In your grandmother's handwriting.": "[hushed, slow] In your grandmother's handwriting."
"Let it stay lost.": "[barely there, her voice in yours, tender] Let it stay lost."
"The rule held. Nobody alive knew.": "[very quiet, the floor drops away] The rule held. Nobody alive knew."
"She hid it. Not his brother.": "[quiet, shaken, plain] She hid it. Not his brother."
"You can't look at the envelope. So you look at everything else.": "[low, restless, night] You can't look at the envelope. So you look at everything else."
"The oldest earring under this city's drains. Not in the bazaar. Out past the old fort.": "[rising, reaching, a little wild] The oldest earring under this city's drains. Not in the bazaar. Out past the old fort."
"The first ship this coast ever lost. Not the wreck you found. Further. Out past it, to open sea.": "[bigger, breathless, far away] The first ship this coast ever lost. Not the wreck you found. Further. Out past it, to open sea."
"Every lost thing on Earth has a line waiting.": "[vast, slow, awed] Every lost thing on Earth has a line waiting."
"You could walk for the rest of your life.": "[quiet, a weight in it] You could walk for the rest of your life."
"Next evening, a power cut. And Madhav is at the gate. Your cousin's video found him first.": "[tense, low, the story speeding up] Next evening, a power cut. And Maadhav is at the gate. Your cousin's video found him first."
"Your grandfather pats his pocket. One, two, three.": "[slow, every count lands] Your grandfather pats his pocket. One, two, three."
"His heart tablet is gone.": "[almost a whisper, fear held down] His heart tablet is gone."
"The whole sea is on your line. Drop it, for one pill?": "[intimate, a real question, both sides weighed] The whole sea is on your line. Drop it, for one pill?"
"Not in the courtyard. In the lining. Under the pocket he patted.": "[quick relief, breath out, tender] Not in the courtyard. In the lining. Under the pocket he patted."
"You give him the tablet. Then the envelope.": "[quiet, simple, letting go] You give him the tablet. Then the envelope."
"Next morning. The doors open. You don't pat your pockets.": "[morning, light, easy, changed] Next morning. The doors open. You don't pat your pockets."
"Some things stay lost. Keeps the peace.": "[soft, remembered, his words in your mouth] Some things stay lost. Keeps the peace."
"Somewhere under that grate is something somebody lost.": "[gentle, curious, close] Somewhere under that grate is something somebody lost."
"What would you leave lost?": "[warm, direct, to the viewer, a smile] What would you leave lost?"
