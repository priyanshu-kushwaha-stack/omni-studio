# Cue sheet, G2 intent (rules/sound.md #1); final spotting at G4. scenes/sound.ts is where it plays.
# v4 (owner, 2026-11-13): "This is a little EMOTIONAL angle story. I don't know if this will go big. Maybe with music we
# can make it better." Lotte gets a theme of her own (make_music.py LOTTE, a waltz on felt piano with a cello answering),
# and it comes back at each of the film's four heart moments: sad at her savings book, on a lone cello at Jonas's "Not
# me", tender at the glass door, whole after the silence. Every set has a two-layer ambience bed (make_ambience.py) and
# the story's props have their sounds (make_sfx.sh), as on the wants-you-to-fail film's v3 notes; until v3 this film
# had voice and music only.
# Levels (sound #4, unchanged): music about 28 dB under the voice, up to hold level in the holds; beds about 30 dB under
# the voice, about 8 dB under the hold music; at most two effects under a line (#9). Music leads each section by 1 s,
# beds by 0.5 s (#7). Rights (#11): theme-light and theme-dark are the channel themes (U1); every cue is made locally by
# ACE-Step 1.5 (U2, owner 2026-11-09, "Yes, keep it"); beds and effects are synthesised. No paid call.
