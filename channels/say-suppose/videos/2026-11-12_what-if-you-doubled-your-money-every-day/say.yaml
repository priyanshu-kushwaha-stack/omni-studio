# say.yaml: every spoken line of script.md v6 (2026-11-15), in order. The key is the line as written, with its
# (cNN) cites removed; character lines keep their "Name: " prefix in the key only. The value is
# "[emotion, acting direction] what the voice says", numbers spelled out. Narrator: Arthur (free local voice);
# Anna, Jonas, Herr Brandt and Karl speak in their own voices. Reused lines keep their earlier direction so their
# cached takes are reused.
"Jonas: Did your phone just... rip?": "[groggy, alarmed, whispered too loud, sitting up in the dark] Did your phone just... rip?"
"Jonas: Two cents. Don't spend it all at once.": "[sleepy sarcasm, flat, the coat already going back over his head] Two cents. Don't spend it all at once."
"Two cents. Last night, one. You know that.": "[hushed, close to the mic, the first words of the narrator, a secret shared in the dark] Two cents. Last night, one. You know that."
"You always know the number.": "[warm, slow, a fact about a friend, a small smile] You always know the number."
"What if your money doubled every day?": "[curious, lifting, the question asked plainly to you, eyes wide] What if your money doubled every day?"
"Every night. Whatever's there at midnight, twice by morning. From one cent. And it will not stop.": "[steady, building, each clause a step, the last four words cold and even] Every night. Whatever's there at midnight, twice by morning. From one cent. And it will not stop."
"Sounds like the best thing that could ever happen to you. Let's see what it costs.": "[warm and bright, then a knowing turn, the last sentence slow and dry, a hook] Sounds like the best thing that could ever happen to you. Let's see what it costs."
"There is no off switch. Except one. Exactly zero at midnight. Not a cent more. Not a cent less.": "[lowered, deliberate, slow, a finger raised, slowing on 'exactly zero', the last two sentences even and quiet, a rule, not a warning] There is no off switch. Except one. Exactly zero at midnight. Not a cent more. Not a cent less."
"So you make yourself a rule too. A sticky note. Stop at a thousand.": "[playful, confident, 'Stop at a thousand' said like a promise you won't keep] So you make yourself a rule too. A sticky note. Stop at a thousand."
"A king, a chessboard. One grain on the first square, and double on every square after. By the last square, the board owes more wheat than the whole world grows in over a thousand years.": "[storytelling, hushed, patient at the start, a widening awe toward the end, no hype] A king, a chessboard. One grain on the first square, and double on every square after. By the last square, the board owes more wheat than the whole world grows in over a thousand years."
"For ten days, nothing happens. Cents. Then it does.": "[dry, slow on 'nothing happens', then a sudden lift on the last three words] For ten days, nothing happens. Cents. Then it does."
"Day eleven. Ten euros. You pay for your own roll.": "[bright, proud, a small victory] Day eleven. Ten euros. You pay for your own roll."
"Anna: I saw.": "[flat, two words, writing on the board, not looking up] I saw."
"Day seventeen. Jonas's rent. Paid.": "[quick, pleased, a montage beat, 'Paid' crisp] Day seventeen. Jonas's rent. Paid."
"Jonas: I'll pay you back.": "[touched, a little embarrassed, earnest] I'll pay you back."
"Jonas: I won't, will I.": "[a beat later, honest and amused at himself, a grin] I won't, will I."
"Day twenty-one. Jonas's birthday. You ordered one cake. He woke up to the whole street.": "[gleeful, quick, the last sentence a comic reveal] Day twenty-one. Jonas's birthday. You ordered one cake. He woke up to the whole street."
"Day twenty-two. Every tram in the city. Free. All day. On you.": "[big, generous, each phrase bigger, 'On you' with a grin] Day twenty-two. Every tram in the city. Free. All day. On you."
"The sticky note gets a new number.": "[dry, knowing, a wink] The sticky note gets a new number."
"Herr Brandt: Is it a mistake?": "[quiet, direct, looking at you over his glasses, a real question] Is it a mistake?"
"Herr Brandt: Not a mistake. Signed.": "[satisfied, precise, the stamp coming down on 'signed', filing it away] Not a mistake. Signed."
"Day twenty-seven. A penthouse over Berlin. Your old room would fit in the bath.": "[wide-eyed, delighted, the last sentence a comic punch] Day twenty-seven. A penthouse over Berlin. Your old room would fit in the bath."
"Day twenty-eight. You buy the building. Anna never pays rent again.": "[proud, warm, quick] Day twenty-eight. You buy the building. Anna never pays rent again."
"Anna has never seen the sea. Day twenty-nine, she does.": "[warm, light, a gift, the last words open] Anna has never seen the sea. Day twenty-nine, she does."
"Anna: It's bigger than the oven.": "[dry, deadpan, squinting at the horizon, secretly delighted] It's bigger than the oven."
"Day thirty. Jonas's football club. The one that loses every Saturday. Not anymore.": "[excited, building, 'Not anymore' a cheer] Day thirty. Jonas's football club. The one that loses every Saturday. Not anymore."
"Jonas: I don't know what to do with my hands when they win.": "[lost, comic, looking at his own hands, a man whose world has changed shape] I don't know what to do with my hands when they win."
"Day thirty-one. Ten million euros. A billion cents.": "[awed, slow, each number landing bigger, 'A billion cents' almost laughing] Day thirty-one. Ten million euros. A billion cents."
"Jonas: Is that... all yours?": "[stunned, small, a loop of paper in his fingers, a joke he cannot find] Is that... all yours?"
"The sticky note gets a new number. It always does.": "[dry, knowing, the second sentence lower, a smirk] The sticky note gets a new number. It always does."
"So you spend. Faster than it grows. Can you?": "[playful, a challenge, quick] So you spend. Faster than it grows. Can you?"
