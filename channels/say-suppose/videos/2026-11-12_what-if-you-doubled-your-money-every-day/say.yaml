"Lotte doesn't laugh.": "[quiet, a small turn, the smile gone] Lotte doesn't laugh."
"Lotte: My grandfather's story. The king's wheat.": "[low, tender, remembering, setting grains down one by one as she speaks] My grandfather's story. The king's wheat."
