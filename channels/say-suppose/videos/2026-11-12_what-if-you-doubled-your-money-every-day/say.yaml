"At midnight, what's left doubles anyway. Thirteen million. You shopped all day, and woke up richer.": "[comic deflation, deadpan, the last clause a punchline] At midnight, what's left doubles anyway. Thirteen million. You shopped all day, and woke up richer."
"You're thinking it. Why not just invest it?": "[knowing, straight to the viewer, a raised eyebrow] You're thinking it. Why not just invest it?"
"You try. You buy shares. The price shoots up. Because you're the one buying. Now you're richer twice.": "[quick, building, then a comic beat on 'richer twice', exasperated and amused] You try. You buy shares. The price shoots up. Because you're the one buying. Now you're richer twice."
"Day thirty-five. A hundred and seventy million. Jonas has a new idea: Anna's rolls, delivered to the whole city. By drone. A thousand drones. You pay.": "[excited, quick, the idea growing as it goes, 'A thousand drones' big, 'You pay' dry] Day thirty-five. A hundred and seventy million. Jonas has a new idea: Anna's rolls, delivered to the whole city. By drone. A thousand drones. You pay."
"Anna: I have two hands and one oven. Eighty rolls a morning. I bake what I bake.": "[calm, firm, counting it out for a child, the last sentence final] I have two hands and one oven. Eighty rolls a morning. I bake what I bake."
"You bought a thousand deliveries. You didn't make one more roll.": "[dry, clear, the punchline slow and flat] You bought a thousand deliveries. You didn't make one more roll."
"Money is a ticket for things people make. Your pile is a bigger ticket for the same bread.": "[clear, firm, plain, the last sentence slow] Money is a ticket for things people make. Your pile is a bigger ticket for the same bread."
"And everything you spend has to land somewhere. It lands where you stand.": "[lower, a turn, quiet and sure] And everything you spend has to land somewhere. It lands where you stand."
"Karl: Same flour. New price. Triple.": "[blunt, invoice held out, no apology, the last word dropped like a sack] Same flour. New price. Triple."
"Karl: The whole street has money now. Everyone charges more. Everyone does.": "[matter-of-fact, gruff, not unkind, clear words, a shrug on the last two words] The whole street has money now. Everyone charges more. Everyone does."
"Day forty. Prices rise first where the new money lands. Your street. One forty. Two ten. Three euros. Four twenty.": "[slow, clear, explaining one hard thing, the numbers falling one by one like chalk] Day forty. Prices rise first where the new money lands. Your street. One forty. Two ten. Three euros. Four twenty."
"She counts what her savings will buy. Last month, a year of flour. Tonight, four months.": "[quiet, close, slowing, the last two words soft] She counts what her savings will buy. Last month, a year of flour. Tonight, four months."
"It isn't taken from anyone. Except it is. From everyone. A little. Every night.": "[the turn: quiet, confessional, each fragment heavier, 'every night' almost broken] It isn't taken from anyone. Except it is. From everyone. A little. Every night."
"So you try the obvious thing. You give it away. Day fifty. Five trillion. A million euros to every phone in Berlin.": "[bold, bright, a big plan, rising to 'every phone in Berlin'] So you try the obvious thing. You give it away. Day fifty. Five trillion. A million euros to every phone in Berlin."
"Nobody goes to work. Why would you? And by Saturday, a roll costs sixty-three euros. Because every million was new money. Chasing the same rolls.": "[comic, quick, 'Why would you?' a shrug, then clear and firm on the reason] Nobody goes to work. Why would you? And by Saturday, a roll costs sixty-three euros. Because every million was new money. Chasing the same rolls."
"Jonas: Sixty-three? Since when?": "[outraged, comic, counting his coins again, clear words] Sixty-three? Since when?"
"Jonas: Not me.": "[gentle, immovable, two words, shaking his head at the phone] Not me."
"This has happened before. For real. In 1324, a king from Mali, Mansa Musa, gave away so much gold in Cairo that gold stayed cheap there for at least twelve years.": "[storytelling, leaning in, 'For real' quiet and certain, a little wonder on the gold] This has happened before. For real. In thirteen twenty-four, a king from Mali, Mansa Musa, gave away so much gold in Cairo that gold stayed cheap there for at least twelve years."
"Right here in Berlin, in 1923, a loaf of bread cost about two hundred billion marks.": "[leaning in, amazed, the number huge and clear] Right here in Berlin, in nineteen twenty-three, a loaf of bread cost about two hundred billion marks."
"People papered their walls with banknotes.": "[wry, quick, a raised eyebrow] People papered their walls with banknotes."
"Day fifty-two. You're on the news. Day fifty-three, every bank in Europe freezes your account. It doesn't matter. Frozen money doubles too.": "[fast, rising, the world reacting, then dry and comic on the last sentence] Day fifty-two. You're on the news. Day fifty-three, every bank in Europe freezes your account. It doesn't matter. Frozen money doubles too."
"Day fifty-five. The number passes what the whole world makes in a year. Every loaf, every car, every hour of work on Earth. About 128 trillion dollars.": "[awed and afraid, slow, the list building, the figure said plainly, no hype] Day fifty-five. The number passes what the whole world makes in a year. Every loaf, every car, every hour of work on Earth. About a hundred and twenty-eight trillion dollars."
"Never hit zero, and by day two hundred and sixty-seven your account holds more cents than the estimated number of hydrogen atoms in the observable universe.": "[hushed awe turning to urgency, slowing on the number, 'cents' crisp with its t, the last words wide and quiet] Never hit zero, and by day two hundred and sixty-seven your account holds more cents than the estimated number of hydrogen atoms in the observable universe."
"The sticky note gets its last number.": "[quiet, decided, a turn, slow] The sticky note gets its last number."
"You call Herr Brandt. Now. The universe can wait. Berlin can't.": "[decided, fast, a breath before 'now'; the last two sentences a dry joke, quick] You call Herr Brandt. Now. The universe can wait. Berlin can't."
"Herr Brandt: So it was a mistake.": "[quiet, on speaker, a statement and a question, no triumph in it] So it was a mistake."
"Herr Brandt: Everything goes. Your wages as well. You understand?": "[careful, slower, a man making sure, clear words, a touch of pity on 'your wages as well'] Everything goes. Your wages as well. You understand?"
"Herr Brandt: Fifty minutes.": "[brisk, procedural, the keyboard already going] Fifty minutes."
"Zero. Everything. Ten minutes to midnight. You breathe out.": "[relief, slow, a long breath before the last sentence] Zero. Everything. Ten minutes to midnight. You breathe out."
"Then the phone buzzes. A refund. From the tram app. From the day you paid for every tram in Berlin. One cent.": "[sudden, tense, quick, each phrase a jolt, 'One cent' flat and terrible] Then the phone buzzes. A refund. From the tram app. From the day you paid for every tram in Berlin. One cent."
