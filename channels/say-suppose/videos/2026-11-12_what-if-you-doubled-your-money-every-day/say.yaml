# say.yaml: every spoken line of script.md v2 (2026-11-12), in order. The key is the line as written, with its
# (cNN) cites removed; character lines keep their "Name: " prefix in the key only. The value is
# "[emotion, acting direction] what the voice says", numbers spelled out. Narrator: Arthur. Lotte, Jonas, the woman
# on the tram, the driver, the man from the bank and the flour man speak in their own voices.
"Lotte: You dropped your money.": "[amused, deadpan, looking down at the counter, a baker who has seen everything] You dropped your money."
"Jonas: That's the whole account?": "[dry disbelief, leaning in, half a laugh held back] That's the whole account?"
