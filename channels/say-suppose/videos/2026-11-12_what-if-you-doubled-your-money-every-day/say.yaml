"Zero, doubled, is zero.": "[quiet, complete, after the silence, a thing finally true, no music] Zero, doubled, is zero."
"Anna: Counted.": "[deadpan, dry, one word, the smallest smile, the gag's last return] Counted."
"Day fifty-six. Jonas pays. He always pays.": "[morning, plain, a small smile, back where we began] Day fifty-six. Jonas pays. He always pays."
"A coin isn't a thing. It's Anna, agreeing to bake tomorrow.": "[quiet, clear, the one idea to take home, said as a complete thought, warmth on her name] A coin isn't a thing. It's Anna, agreeing to bake tomorrow."
