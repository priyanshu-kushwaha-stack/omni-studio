"Lotte: Morning. Counted?": "[cheerful, routine, palm out, chalk in the other hand] Morning. Counted?"
"You hold the phone up to her. And the number won't fit.": "[quiet, then stopping short, a catch in the breath on 'won't fit'] You hold the phone up to her. And the number won't fit."
"Ten million euros. Say it the other way. A billion. Cents.": "[awed, slow, each number weighed, a disbelieving half-laugh on 'cents'] Ten million euros. Say it the other way. A billion. Cents."
