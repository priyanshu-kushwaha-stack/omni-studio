# Cue sheet, G2 intent (v2, exciting not sad, 2026-11-14: thrill, mischief, triumph; no warm cue) (rules/sound.md #1); final spotting at G4. The owner on the last film (taste.md, 2026-11-13):
# "better sound in the video just to break the continuous background music flowing throughout the video which might be
# monotonous". So the score changes with each section (scenes/sound.ts places it) and every set has its own two-layer
# ambience bed (scenes/make_ambience.py). Levels: rules/sound.md #4 (about 26 dB under the voice, about 8 dB under in
# holds), unchanged; beds about 30 dB under the voice. Each section's music and bed start under the cut, 1.0 s and
# 0.5 s early (sound #7).
# Rights (sound #11): theme-light and theme-dark are the channel themes (Eleven Music v2.5 via Higgsfield, U1 cleared);
# every cue is made locally by ACE-Step 1.5 (make_music.py) with a theme as reference_audio (U2, owner 2026-11-09 "Yes,
# keep it"); beds and effects are synthesised (make_ambience.py, make_sfx.sh). No paid call.
# Rule device sound (sound #8): the tag's paper flap as it drops or turns, the digits' flutter, a soft tick when it comes
# true, a dull buzz when it goes crimson, and nothing at all when it goes blank (the film's first silence, at the peak).
beats:
