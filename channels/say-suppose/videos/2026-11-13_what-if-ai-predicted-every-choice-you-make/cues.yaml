  - {beat: The Rule, intent: wonder, music_in: "cue_wonder continues", music_out: "into cue_mischief at the mirror", level: "-26 dB", bed: walkway, fx: [the torn tag, a new tag dropping]}
  - {beat: Random, intent: playful, music_in: "cue_mischief", music_out: "-", level: "-26 dB; the mirror hold at -8 dB", bed: "bathroom, then the court by day", fx: [four buzzes, board flaps up, the coin]}
  - {beat: Your Stall, intent: winning, music_in: "cue_carnival", music_out: "-", level: "-26 dB", bed: court-day, fx: [plates down, the queue doubling]}
  - {beat: The City Plays, intent: busy, music_in: "cue_carnival continues", music_out: "into cue_routine", level: "-26 dB", bed: "platform, street, court, train", fx: [the pickpocket's buzz, doors, the betting window, the TV]}
  - {beat: Boring Pays, intent: mechanical comedy, music_in: "cue_routine", music_out: "into cue_mischief", level: "-26 dB", bed: court-day, fx: [the napkin card flapping before a word]}
  - {beat: Sixty Per Cent, intent: playful, music_in: "cue_mischief (v1's warm cue retired)", music_out: "into cue_dread at the hand", level: "-26 dB", bed: court-day, fx: [his board climbing]}
  - {beat: Red, intent: dread into comedy, music_in: "cue_dread after the crimson tag", music_out: "into cue_clock", level: "-26 dB", bed: "closing, the coffee stall, the platform, paper, closing", fx: [crimson buzz, the shutter rattle and clank, the cup scraping away and back, the coffee clack on the tray]}
  - {beat: The Dilemma, intent: suspense, music_in: "cue_clock", music_out: "into theme-dark-thin", level: "-26 dB", bed: court-night, fx: [the coffee seller's phone up, crimson buzz]}
