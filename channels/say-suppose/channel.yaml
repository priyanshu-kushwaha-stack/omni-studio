# Validated by core/studio/channels.py. Unknown fields and bad values are errors.
id: say-suppose
youtube_channel_id: UC_Ve59ry_JYiX8sUaSOV8sQ   # @SaySuppose, page set up 2026-11-06
status: draft                   # draft | testing | live | paused
niche: "One what-if per video, followed through with real physics, biology, history and economics"
risk_class: B                   # A | B | C. Original code-drawn art and a preset voice; real-world claims cited in claims.md
made_for_kids: false
# Format name -> OpenMontage pipeline in core/openmontage/pipeline_defs/.
formats:
  story: studio-whatif            # No length cap (style.md), 16:9, five owner gates (2026-11-10). Shorts get their own pipeline later (style.md)
playbook: say-suppose              # Loads by name through styles/custom/say-suppose.yaml.
voices: voices.yaml             # Relative to this folder.
music:
  default: null                 # Each video gets its own score (style.md, Voice and sound); no channel-wide track.
  allowed: []
cadence: daily                  # The owner's target (2026-11-06). style.md says what daily needs first.
budget_usd_per_video: 5         # Owner, 2026-11-07: "Set the channel budget so it allows narration". Higgsfield bills credits
                                # from the owner's plan (no dollar rate shown); each video's costs.md records credits.
review_level: full              # full | standard | light. Recorded only: gates come from the pipeline.
upload_token_path: ~/.config/omni-studio/youtube/say-suppose.token   # The owner creates the OAuth token before the first real upload.
loudness:                       # Format name -> mix targets, checked before the edit and final-watch gates.
  story: {integrated_lufs: -14, tolerance_lu: 1, true_peak_dbtp_max: -1, lra_lu_max: 11}
upload:                         # omni upload defaults. Privacy is always private.
  contains_synthetic_media: null  # true | false. null: every video answers it in its upload.yaml.
  category_id: "27"
  language: en
